/* ===================== PHONE ===================== */
const Phone=(()=>{
  let net,room,pid,name='',me=null,wantJoin=false,lastV=-1,lastVt=0,S=null,connected=false,endAt=0,inited=false,gtitle=(QS.get('n')||'Trail Summit Challenge').slice(0,40);
  let micOK=false,motionOK=false,sensorsAsked=false,an=null,buf=null,micV=0,shakeV=0,taps=[],v=0,myAns=null,ansQ=-1,lastKey='';
  let GO=[],J=null,lockUntil=0,lockMs=2000,doneG=0,doneUntil=0,toastUntil=0,pdi=0,pdiSent=false,wraps=0,sub4=0;
  const later=ms=>setTimeout(()=>{lastKey='';draw()},ms+40);
  const RING=2*Math.PI*46;
  function init(r){
    if(inited)return;inited=true;room=r;document.title=gtitle;
    try{pid=localStorage.getItem('trail_pid');name=localStorage.getItem('trail_name')||''}catch(e){}
    if(!pid){pid='p'+Math.random().toString(36).slice(2,10);try{localStorage.setItem('trail_pid',pid)}catch(e){}}
    if(QS.get('pid'))pid=QS.get('pid');
    net=PhoneNet(room,QS.get('k'),+QS.get('b')||0,pid,onMsg,(ok,via,changed)=>{connected=ok;
      stat(ok,ok?(me?'Terhubung ke room '+room:'Tersambung, menunggu layar host…')+(via==='relay'?' (relay)':''):'Menghubungkan ke room '+room+'…');
      if(ok&&changed&&wantJoin)net.send({t:'join',name})});
    setInterval(()=>{if(wantJoin&&!me&&connected)net.send({t:'join',name})},1500);
    setInterval(()=>{if(me&&connected)net.send({t:'hb'})},3000);
    setTimeout(()=>{if(!connected)stat(false,'Belum tersambung. Pastikan HP terhubung internet dan scan QR terbaru dari layar.')},15000);
    draw();
    setInterval(tick,250);
    (function raf(){meter();requestAnimationFrame(raf)})();
  }
  function stat(ok,t){$('pstat').classList.toggle('on',!!ok);$('pstt').textContent=t}
  function onMsg(m){
    if(m.t==='me'){me=m;stat(true,'Terhubung ke room '+room+(net&&net.via()==='relay'?' (relay)':''));draw()}
    else if(m.t==='s'){S=m;if(m.title&&m.title!==gtitle){gtitle=m.title;document.title=gtitle;if(!me)lastKey=''}endAt=performance.now()+m.left;if(m.phase==='q'&&m.q&&m.q.i!==ansQ){myAns=null;ansQ=m.q.i}if(m.phase==='intro'||m.phase==='lobby'){ansQ=-1;myAns=null}draw()}
    else if(m.t==='st'&&S){m.teams.forEach((t,i)=>{if(S.teams[i]){S.teams[i].f=t.f;S.teams[i].r=t.r;S.teams[i].sc=t.sc}});head()}
    else if(m.t==='ord'){GO=m.list||[];if(!J)draw()}
    else if(m.t==='job'){const prev=J&&J.step,now=performance.now();J=m.job;
      if(J){J.readyAt=now+J.wait;if(J.step!==prev){pdi=0;pdiSent=false;wraps=0;sub4=0}later(J.wait)}
      if(m.wrong){lockUntil=now+m.lock;lockMs=m.lock;later(m.lock)}
      if(m.done){doneG=m.done;doneUntil=now+1600;later(1600)}
      if(m.taken){toastUntil=now+1800;later(1800)}
      lastKey='';draw()}
    else if(m.t==='who'){if(name){wantJoin=true;net.send({t:'join',name})}}
    else if(m.t==='full'){$('pbody').innerHTML='<div class="xsec"><div><span class="xk">Tidak bisa bergabung</span><h2 class="xh2">Room penuh</h2></div></div><p class="xp">Room ini sudah berisi 50 pemain, batas maksimal.</p>'}
  }
  function mode(){
    if(!S||S.game==='gudang'||S.phase!=='play'||!S.round)return null;
    const t=S.round.type;
    if(t==='shout'&&!micOK)return'tap';
    if(t==='shake'&&!motionOK)return'tap';
    return t;
  }
  function tick(){
    const md=mode();
    if(md){
      const now=performance.now();
      if(md==='tap'){taps=taps.filter(x=>now-x<1000);v=clamp(taps.length/(S.sens.tap||8))}
      else if(md==='shout')v=micV;
      else if(md==='shake')v=shakeV;
      const vv=+v.toFixed(2),nw=performance.now();if(Math.abs(vv-lastV)>=.03||nw-lastVt>900){lastV=vv;lastVt=nw;net.send({t:'v',v:vv})}
    }else v=0;
    const secs=Math.max(0,Math.ceil((endAt-performance.now())/1000));document.querySelectorAll('[data-tm]').forEach(e=>e.textContent=secs);
    if(S&&S.game==='gudang'&&performance.now()<lockUntil){const h1=document.querySelector('#pbody .xhero.bad .xh');if(h1)h1.textContent='Tunggu '+Math.max(1,Math.ceil((lockUntil-performance.now())/1000))+' detik'}
  }
  function meter(){
    if(an){an.getFloatTimeDomainData(buf);let s=0;for(let i=0;i<buf.length;i++)s+=buf[i]*buf[i];
      const db=20*Math.log10(Math.sqrt(s/buf.length)+1e-7);
      const t=clamp((db+42)/34*((S&&S.sens.mic)||1));micV+=(t-micV)*(t>micV?.5:.12)}
    if(S&&S.game==='gudang'&&J&&J.step===3&&performance.now()>=J.readyAt&&!pdiSent&&motionOK&&shakeV>.15){pdi=Math.min(1,pdi+shakeV*.035);pdiUI();if(pdi>=1){pdiSent=true;net.send({t:'act',step:3,ok:1})}}
    shakeV*=.94;
    const md=mode(),ring=$('ring');
    if(ring){const now=performance.now();const live=md==='tap'?clamp(taps.filter(x=>now-x<1000).length/((S&&S.sens.tap)||8)):md==='shout'?micV:shakeV;ring.style.strokeDashoffset=RING*(1-live)}
  }
  async function sensors(){
    sensorsAsked=true;
    try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}
    try{
      if(typeof DeviceMotionEvent!=='undefined'){
        if(typeof DeviceMotionEvent.requestPermission==='function'){const r=await DeviceMotionEvent.requestPermission();if(r!=='granted')throw 0}
        addEventListener('devicemotion',e=>{
          let a=e.acceleration;let m=0;
          if(a&&a.x!=null)m=Math.hypot(a.x,a.y,a.z);
          else{a=e.accelerationIncludingGravity;if(!a||a.x==null)return;m=Math.abs(Math.hypot(a.x,a.y,a.z)-9.81)}
          if(!motionOK){motionOK=true;lastKey='';draw()}
          const t=clamp(m/(22/((S&&S.sens.shake)||1)));if(t>shakeV)shakeV+=(t-shakeV)*.5;
        });
      }
    }catch(e){}
    try{
      const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      const ac=new(window.AudioContext||window.webkitAudioContext)();await ac.resume();
      const src=ac.createMediaStreamSource(st);an=ac.createAnalyser();an.fftSize=1024;buf=new Float32Array(an.fftSize);src.connect(an);micOK=true;
    }catch(e){micOK=false}
    lastKey='';draw();
  }
  /* ---------- controller UI (game-style) ---------- */
  const SV=(d,extra)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra||''}>${d}</svg>`;
  const IC={
    mount:SV('<path d="M2.5 19.5 9 8.5l4 6.2 2.2-3.2 6.3 8z"/><path d="M7.2 11.6 9 13l1.6-1.4"/>'),
    box:SV('<path d="M3 7.5 12 3l9 4.5-9 4.5z"/><path d="M3 7.5v9L12 21l9-4.5v-9"/><path d="M12 12v9"/><path d="m7.5 5.2 9 4.6"/>'),
    bike:SV('<circle cx="5.5" cy="16.5" r="3"/><circle cx="18.5" cy="16.5" r="3"/><path d="M5.5 16.5 9 10h5l2.5 6.5"/><path d="m14 10 1.5-3H18"/><path d="M8 10h3"/>'),
    truck:SV('<path d="M2.5 6h11v10h-11z"/><path d="M13.5 9.5h4l3 3.5v3h-7z"/><circle cx="6.5" cy="17.5" r="2"/><circle cx="17" cy="17.5" r="2"/>'),
    mic:SV('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>'),
    shake:SV('<rect x="7.5" y="3" width="9" height="18" rx="2.2"/><path d="M3.5 8.5 2 12l1.5 3.5M20.5 8.5 22 12l-1.5 3.5"/>'),
    check:SV('<path d="m5 12.5 4.5 4.5L19 7.5"/>','stroke-width="2.6"'),
    pin:SV('<path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>'),
    bolt:SV('<path d="M13 2.5 4.5 13.5H11l-1 8 8.5-11H12z"/>'),
    clip:SV('<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M8.5 10h7M8.5 14h7M8.5 18h4"/>'),
    wrench:SV('<path d="M14.5 3.5a5 5 0 0 0-5.7 6.9L3.5 15.7a2 2 0 0 0 2.8 2.8l5.3-5.3a5 5 0 0 0 6.9-5.7l-3 3-2.6-.6-.6-2.6z"/>'),
    tape:SV('<circle cx="10" cy="12" r="6.5"/><circle cx="10" cy="12" r="2.5"/><path d="M16.5 12H22"/>'),
    flag:SV('<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>'),
    users:SV('<circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 5.5a3.5 3.5 0 0 1 0 6.5M18 14.5a6 6 0 0 1 3.5 5.5"/>'),
    star:`<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="m12 2.8 2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg>`,
    trophy:SV('<path d="M7.5 4h9v5a4.5 4.5 0 0 1-9 0z"/><path d="M7.5 6H4v1.5A3.5 3.5 0 0 0 7.6 11M16.5 6H20v1.5a3.5 3.5 0 0 1-3.6 3.5M12 13.5V17M8.5 20.5h7M9.5 17h5v3.5h-5z"/>')
  };
  const gameIc=()=>S&&S.game==='gudang'?IC.box:IC.mount;
  const lumP=h=>{const n=parseInt(String(h).slice(1),16);return(.299*(n>>16&255)+.587*(n>>8&255)+.114*(n&255))/255};
  function head(){
    const t=me&&S&&S.teams[me.team],GG=S&&S.game==='gudang';
    const av=$('pav');
    $('phone').style.setProperty('--c',t?t.color:'#7E819F');
    av.innerHTML=gameIc();
    $('pname').textContent=me?name:gtitle;
    $('pteam').textContent=!me?'Room '+room:!t?'Menghubungkan':S.mode==='solo'?'Main individu':t.name;
    const tm=$('ptim');const timed=S&&['intro','play','q'].includes(S.phase);tm.classList.toggle('hide',!timed);
    const st=$('pstats');
    if(!me||!S||!t){st.innerHTML=`<div><b>${esc(room)}</b><span>Kode room</span></div><div><b>${GG||QS.get('g')?'Gudang':'Pendakian'}</b><span>Game</span></div><div><b>${connected?'Online':'...'}</b><span>Status</span></div>`;return}
    const ph=S.phase;
    if(ph==='lobby')st.innerHTML=`<div><b>${S.mode==='solo'?'Individu':'Tim'}</b><span>Mode</span></div><div><b>${S.teams.length}</b><span>${S.mode==='solo'?'Pemain':'Tim'}</span></div><div><b>${motionOK||micOK?'Siap':'Belum'}</b><span>Sensor</span></div>`;
    else st.innerHTML=`<div><b>P${t.r||'-'}</b><span>Posisi</span></div><div><b>${GG?(t.sc||0):Math.round((t.f||0)*100)+'%'}</b><span>${GG?'Poin':'Ke puncak'}</span></div><div><b>${Math.min(S.ri+1,S.n)}/${S.n}</b><span>${GG?'Shift':'Ronde'}</span></div>`;
  }
  const BIKE=h=>`<svg viewBox="0 0 48 30" aria-hidden="true"><circle cx="11" cy="22" r="7" fill="#1E2128"/><circle cx="37" cy="22" r="7" fill="#1E2128"/><circle cx="11" cy="22" r="2.5" fill="#8E96A3"/><circle cx="37" cy="22" r="2.5" fill="#8E96A3"/><path d="M5 15 L17 10 L29 10 L35 3 L40 5 L38 14 L27 19 L13 19Z" fill="${h}" stroke="rgba(24,33,47,.35)" stroke-width="1" stroke-linejoin="round"/><path d="M7 12 L21 9 L22 12 L9 15Z" fill="#22252C"/></svg>`;
  const sec=(k,t,n,ic)=>`<div class="xsec">${n!=null?`<span class="xn">${n}</span>`:''}<div><span class="xk">${k}</span><h2 class="xh2">${t}</h2></div>${ic?`<span class="xsq">${ic}</span>`:''}</div>`;
  const hero=(o)=>`<div class="xhero ${o.cls||''}"><div class="xrays"></div>${o.stars?`<div class="xstars"><i>${IC.star}</i><i>${IC.star}</i><i>${IC.star}</i></div>`:''}<div class="xbadge" style="${o.col?'--c:'+o.col:''}">${o.ic||gameIc()}</div>${o.k?`<div class="xk">${o.k}</div>`:''}<h1 class="xh">${o.t}</h1>${o.p?`<p class="xp">${o.p}</p>`:''}${o.chips?`<div class="xchips">${o.chips.map(c=>`<div><b>${c[0]}</b><span>${c[1]}</span></div>`).join('')}</div>`:''}${o.btn||''}</div>`;
  const row=(o)=>`<${o.tag||'div'} class="xrow ${o.cls||''}" ${o.attr||''}><span class="xtile" style="${o.tc?'--tc:'+o.tc:''}">${o.ic}</span><div class="xcols">${o.cols.map(c=>`<div><span>${c[0]}</span><b>${c[1]}</b></div>`).join('')}</div>${o.right||''}</${o.tag||'div'}>`;
  function gPlay(){
    const now=performance.now(),steps=[['Pesanan',IC.clip],['Unit',IC.box],['PDI',IC.wrench],['Packing',IC.tape],['Kirim',IC.truck]];
    if(now<doneUntil)return hero({cls:'ok',stars:1,ic:IC.truck,k:'Pesanan terkirim',t:'+'+doneG+' poin',p:'Mantap, unit sudah di truk. Ambil pesanan berikutnya.',btn:`<button class="xbtn" id="gnext">Ambil pesanan lagi</button>`});
    if(now<lockUntil)return hero({cls:'bad',ic:IC.wrench,col:'#E5484D',k:'Langkah salah',t:'Tunggu '+Math.max(1,Math.ceil((lockUntil-now)/1000))+' detik',p:'Cek lagi detail pesanannya, lalu coba lagi.'});
    if(!J){
      const list=GO.slice(0,5);
      return sec('Tersedia','Pesanan',GO.length,IC.box)+(now<toastUntil?'<div class="xnote bad">Pesanan itu sudah diambil orang lain.</div>':'')+
        (list.length?`<div class="xlist">`+list.map(o=>row({tag:'button',cls:o.ex?'ex':'',attr:`data-o="${o.id}"`,ic:`<b class="xpt">${o.pts}</b>`,cols:[[(o.ex?'Ekspres, ':'')+esc(o.c),esc(o.m)],['Tujuan',esc(o.city)]],right:`<span class="xgo">Ambil</span>`})).join('')+`</div>`:'<div class="xwait"><i></i>Menunggu pesanan baru</div>');
    }
    const o=J.o,ready=now>=J.readyAt;
    let h=`<div class="xsteps">`+steps.map((s,i)=>`<div class="${i+1<J.step?'done':i+1===J.step?'cur':''}"><span>${i+1<J.step?IC.check:s[1]}</span><small>${s[0]}</small></div>`).join('')+`</div>`+
      `<div class="xticket ${o.ex?'ex':''}"><div class="xcols"><div><span>Unit</span><b>${esc(o.m)}</b></div><div><span>Warna</span><b>${esc(o.c)}</b></div><div><span>Tujuan</span><b>${esc(o.city)}</b></div></div>${o.ex?`<span class="xex">${IC.bolt}</span>`:''}</div>`;
    if(!ready)return h+`<div class="xwalk"><div class="xwait"><i></i>Menuju ${esc(J.st)}</div><div class="xbar"><i class="gwalk" style="animation-duration:${Math.max(.2,(J.readyAt-now)/1000)}s"></i></div></div>`;
    if(J.step===1)h+=sec('Langkah 1','Konfirmasi pesanan')+`<p class="xp">Pastikan unit, warna, dan kota tujuan sudah benar.</p><button class="xbtn" id="gok">Proses pesanan</button>`;
    else if(J.step===2)h+=sec('Langkah 2','Ambil unit')+`<div class="xpick n${J.opts.length}">`+J.opts.map((u,i)=>`<button data-c="${i}"><b>${esc(u.m)}</b><small><i style="background:${u.h}"></i>${esc(u.c)}</small></button>`).join('')+`</div>`;
    else if(J.step===3)h+=sec('Langkah 3','Cek PDI mesin')+`<div class="xgauge"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" class="t"/><circle id="pdiRing" cx="60" cy="60" r="52" class="v" style="stroke-dashoffset:${327*(1-pdi)}"/></svg><div><span class="xgi">${motionOK?IC.shake:IC.wrench}</span><b id="pdiPct">${Math.round(pdi*100)}%</b><small>${motionOK?'Goyangkan HP':'Tap tombol'}</small></div></div><button class="xbtn" id="pdiTap">${motionOK?'Atau tap di sini':'Cek mesin'}</button>`;
    else if(J.step===4&&sub4===0)h+=sec('Langkah 4','Bungkus unit')+`<div class="xbig"><button id="wrap"><span>${IC.tape}</span><b>Bungkus</b><small id="wrapCnt">${wraps}/8</small></button><div class="xbar"><i id="wrapBar" style="width:${wraps/8*100}%"></i></div></div>`;
    else if(J.step===4)h+=sec('Langkah 4','Tempel label tujuan')+`<div class="xlist">`+J.opts.map(c=>row({tag:'button',attr:`data-c="${esc(c)}"`,ic:IC.pin,cols:[['Kota tujuan',esc(c)]],right:`<span class="xgo">Tempel</span>`})).join('')+`</div>`;
    else if(J.step===5)h+=sec('Langkah 5','Muat ke truk')+`<div class="xlist">`+J.opts.map((r,i)=>row({tag:'button',attr:`data-c="${i}"`,ic:IC.truck,cols:[['Truk '+esc(r.n),`<small>${esc(r.c.join(', '))}</small>`]],right:`<span class="xgo">Muat</span>`})).join('')+`</div>`;
    return h;
  }
  function gBind(B){
    B.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{b.disabled=true;net.send({t:'take',oid:+b.dataset.o})});
    const act=m=>{if(!J)return;net.send(Object.assign({t:'act',step:J.step},m))};
    const ok=$('gok');if(ok)ok.onclick=()=>{ok.disabled=true;act({ok:1})};
    const nx=$('gnext');if(nx)nx.onclick=()=>{doneUntil=0;lastKey='';draw()};
    B.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{B.querySelectorAll('[data-c]').forEach(x=>x.disabled=true);const v=b.dataset.c;act({choice:J.step===4?v:+v})});
    const pt=$('pdiTap');if(pt)pt.onclick=()=>{pdi=Math.min(1,pdi+(motionOK?.08:.1));pdiUI();if(pdi>=1&&!pdiSent){pdiSent=true;act({ok:1})}};
    const wr=$('wrap');if(wr)wr.onclick=()=>{wraps++;const bar=$('wrapBar');if(bar)bar.style.width=Math.min(100,wraps/8*100)+'%';const wc=$('wrapCnt');if(wc)wc.textContent=Math.min(8,wraps)+'/8';wr.classList.add('hit');setTimeout(()=>wr.classList.remove('hit'),70);if(wraps>=8){sub4=1;lastKey='';draw()}};
  }
  function pdiUI(){const r=$('pdiRing');if(r)r.style.strokeDashoffset=327*(1-pdi);const pc=$('pdiPct');if(pc)pc.textContent=Math.round(pdi*100)+'%'}
  function draw(){
    head();
    const B=$('pbody');
    if(!me){
      if(lastKey==='join')return;lastKey='join';
      B.innerHTML=`${QS.get('g')?'<img class="plogo" src="assets/yours-logo-white.png" alt="YOURS" onerror="this.remove()">':''}${sec('Room '+esc(room),esc(gtitle))}<p class="xp">Isi nama yang akan tampil di layar utama.</p><div class="xfield"><span>${IC.users}</span><input id="nm" maxlength="16" placeholder="Nama kamu" value="${esc(name)}" autocomplete="nickname"></div><button class="xbtn" id="jb">Gabung</button>`;
      $('jb').onclick=()=>{name=$('nm').value.trim()||'Pemain';try{localStorage.setItem('trail_name',name)}catch(e){}wantJoin=true;net.send({t:'join',name});const b=$('jb');b.disabled=true;b.textContent=connected?'Bergabung…':'Menyambungkan…';stat(connected,connected?'Bergabung…':'Menyambungkan ke layar host…')};
      return;
    }
    if(!S)return;
    const t=S.teams[me.team]||S.teams[0],ph=S.phase,md=mode();
    const GG=S.game==='gudang',nowk=performance.now();
    const key=[ph,S.ri,S.q&&S.q.i,md,me.team,myAns,sensorsAsked,micOK,motionOK,ph==='lobby'?S.teams.map(x=>x.name+x.color).join():'',GG&&ph==='play'?[J&&J.step,J&&nowk>=J.readyAt,sub4,nowk<lockUntil,nowk<doneUntil,nowk<toastUntil,J?'':GO.map(o=>o.id).join()].join(','):''].join('|');
    if(key===lastKey)return;lastKey=key;
    let h='';
    const sensRows=`<div class="xlist">`+row({ic:IC.mic,cols:[['Mikrofon',micOK?'Aktif':sensorsAsked?'Tidak tersedia':'Belum aktif']],right:micOK?`<span class="xok">${IC.check}</span>`:''})+row({ic:IC.shake,cols:[['Sensor gerak',motionOK?'Aktif':sensorsAsked?'Goyangkan untuk tes':'Belum aktif']],right:motionOK?`<span class="xok">${IC.check}</span>`:''})+`</div>`;
    if(ph==='lobby'){
      if(GG)h+='<img class="plogo" src="assets/yours-logo-white.png" alt="YOURS" onerror="this.remove()">';
      if(S.mode==='solo')h+=sec('Mode individu','Karaktermu')+`<div class="xcards one"><div class="xcard sel" style="--k:${t.color}"><span class="xci">${gameIc()}</span><b>${esc(name)}</b><small>Warna kamu di layar</small></div></div>`;
      else if(S.pick&&S.teams.length>1)h+=sec('Pilih','Tim kamu',S.teams.length)+`<div class="xcards">`+S.teams.map((x,i)=>`<button data-t="${i}" class="xcard ${i===me.team?'sel':''}" style="--k:${x.color}"><span class="xci">${gameIc()}</span><b>${esc(x.name)}</b>${i===me.team?`<span class="xchk">${IC.check}</span>`:''}</button>`).join('')+`</div>`;
      else h+=sec('Kamu bergabung di','Tim kamu')+`<div class="xcards one"><div class="xcard sel" style="--k:${t.color}"><span class="xci">${gameIc()}</span><b>${esc(t.name)}</b><small>Dibagi otomatis</small></div></div>`;
      h+=sec('Perangkat','Sensor HP')+sensRows;
      if(!sensorsAsked)h+=`<button class="xbtn" id="sb">Aktifkan mic dan sensor</button>`;
      h+=`<div class="xwait"><i></i>Menunggu host memulai game</div>`;
    }else if(ph==='intro'){
      h=hero({k:(GG?'Shift ':'Ronde ')+(S.ri+1)+' dari '+S.n,t:esc(S.round.title),p:GG?'Ambil pesanan, kerjakan 5 langkah, dan kirim ke truk yang benar. Salah langkah kena tunda.':esc(S.round.desc),btn:`<div class="xcount"><b data-tm></b><small>detik lagi</small></div>`});
      if(GG&&!motionOK)h+=`<button class="xbtn ghost" id="sb">Aktifkan sensor gerak untuk cek PDI</button>`;
      if(!GG&&!sensorsAsked&&(S.round.type==='shout'||S.round.type==='shake'))h+=`<button class="xbtn ghost" id="sb">Aktifkan mic dan sensor</button>`;
    }else if(ph==='play'&&GG){h=gPlay()
    }else if(ph==='play'){
      const lab=md==='tap'?['Daki','Tap secepat mungkin',IC.mount]:md==='shout'?['Teriak','Makin keras, makin kencang',IC.mic]:['Goyang','Goyangkan sekuat tenaga',IC.shake];
      h=`<div id="padw"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,122,26,.18)" stroke-width="4"/><circle id="ring" cx="50" cy="50" r="46" fill="none" stroke="#FF9F43" stroke-width="4" stroke-linecap="round" stroke-dasharray="${RING}" stroke-dashoffset="${RING}"/></svg>
        <div id="pad"><span class="xpadi">${lab[2]}</span><b>${lab[0]}</b><small>${lab[1]}</small></div></div>`+
        (md==='tap'&&S.round.type!=='tap'?'<div class="xnote">Sensor belum aktif, jadi kamu pakai tap.</div>':'')+
        `<div class="xlist">`+row({ic:IC.flag,cols:[['Ronde',esc(S.round.title)],['Waktu','<span data-tm></span> dtk']]})+`</div>`;
    }else if(ph==='q'||ph==='reveal'){
      h=sec('Soal '+(S.q.i+1)+' dari '+S.q.n,'Kuis')+`<div class="xq">${esc(S.q.text)}</div><div class="xlist">`+
        S.q.opts.map((o,i)=>{let c='';if(ph==='reveal'){c=i===S.ans?'ok':(i===myAns?'no':'')}else if(i===myAns)c='sel';
          return`<button data-a="${i}" class="xrow xopt ${c}" ${myAns!=null||ph==='reveal'?'disabled':''}><span class="xtile">${'ABCD'[i]}</span><div class="xcols"><div><b>${esc(o)}</b></div></div>${c==='ok'?`<span class="xok">${IC.check}</span>`:''}</button>`}).join('')+`</div>`+
        (ph==='reveal'?`<div class="xverd ${myAns===S.ans?'ok':'no'}">${myAns===S.ans?'Benar!':myAns==null?'Waktu habis':'Belum tepat'}</div>`:myAns!=null?'<div class="xwait"><i></i>Jawaban terkunci, tunggu hasilnya</div>':'');
    }else if(ph==='result'||ph==='end'){
      const end=ph==='end',win=end&&t.r===1,solo=S.mode==='solo';
      h=hero({cls:win?'win':'',stars:win||!end,col:t.color,ic:win?IC.trophy:gameIc(),k:end?'Game selesai':(GG?'Shift ':'Ronde ')+(S.ri+1)+' selesai',
        t:win?(solo?'Kamu juara!':'Tim kamu juara!'):'Posisi '+t.r,
        p:(solo?esc(name):esc(t.name))+(end?'. Terima kasih sudah bermain.':'. Lihat layar utama untuk '+(GG?'shift':'ronde')+' berikutnya.'),
        chips:[['P'+t.r,'Posisi'],[GG?(t.sc||0):Math.round((t.f||0)*100)+'%',GG?'Poin':'Ke puncak'],[S.teams.length,solo?'Pemain':'Tim']]});
    }
    B.innerHTML=h;
    const sb=$('sb');if(sb)sb.onclick=sensors;
    B.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>net.send({t:'team',team:+b.dataset.t}));
    if(GG&&ph==='play')gBind(B);
    B.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(myAns!=null||S.phase!=='q')return;myAns=+b.dataset.a;net.send({t:'ans',q:S.q.i,a:myAns});draw()});
    const pad=$('padw');
    if(pad)pad.addEventListener('pointerdown',e=>{e.preventDefault();taps.push(performance.now());const p=$('pad');p.classList.add('hit');setTimeout(()=>p.classList.remove('hit'),60)});
    tick();
  }
  return{init};
})();

route();
</script>
