<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0C1426">
<title>Trail Summit Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --ink:#0C1426;--ink2:#131E36;--ink3:#1B2846;
  --line:rgba(214,226,255,.10);--line2:rgba(214,226,255,.18);
  --snow:#F3F5F9;--mute:#8E9AB5;--soft:#C3CCDF;
  --gold:#F2C46D;--ok:#3CCB8E;--bad:#F0565B;
  --fd:"Saira Condensed","Arial Narrow","DejaVu Sans Condensed",sans-serif;
  --fb:"Saira","Inter",system-ui,sans-serif;
  --glass:rgba(10,17,33,.72);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--snow);font-family:var(--fb);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:10px;padding:.72em 1.25em;background:var(--snow);color:var(--ink);font-weight:600;letter-spacing:.01em;transition:transform .12s,background .2s,opacity .2s}
button:active{transform:scale(.97)}
button.ghost{background:rgba(255,255,255,.06);color:var(--snow);box-shadow:inset 0 0 0 1px var(--line2)}
button.ghost:hover{background:rgba(255,255,255,.11)}
button:disabled{opacity:.35;cursor:default;transform:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,select{font:inherit;color:var(--snow);background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:8px;padding:.6em .7em;width:100%}
select option{background:var(--ink2)}
.hide{display:none!important}
.screen{position:fixed;inset:0}
h1,h2,h3{margin:0;font-weight:700}
.num{font-family:var(--fd);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- MENU ---------- */
#menu{display:grid;place-items:center;text-align:center;padding:24px;
  background:linear-gradient(180deg,#0D1833 0%,#24305E 46%,#7A6A96 70%,#E7B08E 88%,#F4D2A2 100%)}
#menu svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:58%}
#menu .in{position:relative;z-index:1;display:grid;gap:22px;justify-items:center;margin-top:-14vh}
#menu .kicker{font-family:var(--fd);font-weight:600;font-size:clamp(16px,2vw,22px);color:var(--gold);letter-spacing:.04em}
#menu h1{font-family:var(--fd);font-weight:800;font-size:clamp(52px,9vw,128px);line-height:.86;letter-spacing:-.01em}
#menu p{color:var(--soft);max-width:30em;margin:0;line-height:1.55}
#menu .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}
#menu button{font-size:17px;padding:.9em 1.6em}

/* ---------- HOST ---------- */
#host canvas{position:absolute;inset:0;width:100%;height:100%}
#hud{position:absolute;left:2.4vw;top:3vh;max-width:52vw;pointer-events:none}
#hud .ev{font-size:1.75vh;color:rgba(243,245,249,.7);font-weight:500}
#hud .rn{font-family:var(--fd);font-size:2.2vh;color:var(--gold);font-weight:600;margin-top:1.6vh}
#hud .rt{font-family:var(--fd);font-weight:800;font-size:6.2vh;line-height:.95;text-shadow:0 2px 24px rgba(8,14,30,.55)}
#hud .tm{display:flex;align-items:baseline;gap:.8vh;margin-top:1.4vh}
#hud .tm b{font-family:var(--fd);font-weight:700;font-size:10vh;line-height:.9;font-variant-numeric:tabular-nums}
#hud .tm span{font-size:1.8vh;color:var(--soft)}
#hud .tb{height:3px;width:22vh;background:rgba(255,255,255,.15);border-radius:3px;margin-top:1vh;overflow:hidden}
#hud .tb i{display:block;height:100%;background:var(--gold);width:100%}
#warn{position:absolute;left:2.4vw;bottom:10vh;max-width:40vw;background:rgba(120,40,20,.85);border-radius:8px;padding:.8vh 1vw;font-size:1.6vh;z-index:5}
#roomtag{position:absolute;right:23.2vw;bottom:2.6vh;font-size:1.7vh;color:var(--soft);background:var(--glass);backdrop-filter:blur(10px);padding:.9vh 1.2vw;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line)}
#roomtag b{font-family:var(--fd);color:var(--snow);font-size:2.4vh;letter-spacing:.18em;margin-left:.6vw}

#tower{position:absolute;right:1.2vw;top:2.4vh;bottom:2.4vh;width:21vw;background:var(--glass);backdrop-filter:blur(14px);border-radius:16px;box-shadow:inset 0 0 0 1px var(--line);padding:2.2vh 1.1vw;display:flex;flex-direction:column;gap:.9vh;overflow:hidden}
#tower .th{display:flex;justify-content:space-between;align-items:baseline;padding:0 .3vw 1vh;border-bottom:1px solid var(--line);margin-bottom:.4vh}
#tower .th b{font-family:var(--fd);font-size:2.8vh;font-weight:700}
#tower .th span{font-size:1.5vh;color:var(--mute)}
.row{display:grid;grid-template-columns:3.2vh 4px 1fr auto;column-gap:.8vw;align-items:center;padding:1.05vh .4vw;border-radius:8px}
.row.lead{background:rgba(242,196,109,.08)}
.row .ps{font-family:var(--fd);font-weight:700;font-size:2.8vh;color:var(--mute);text-align:center}
.row.lead .ps{color:var(--gold)}
.row .cb{height:3.6vh;border-radius:2px;background:var(--c)}
.row .nm{font-weight:600;font-size:1.95vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sb{font-size:1.35vh;color:var(--mute)}
.row .pc{font-family:var(--fd);font-weight:700;font-size:2.7vh;font-variant-numeric:tabular-nums}
.row .pw{grid-column:3/5;height:2px;background:rgba(255,255,255,.06);border-radius:2px;margin-top:.7vh;overflow:hidden}
.row .pw i{display:block;height:100%;width:0;background:var(--c);transition:width .15s}

#ctrl{position:absolute;left:2.4vw;bottom:2.4vh;display:flex;gap:.6vw;align-items:center;padding:.7vh;background:var(--glass);backdrop-filter:blur(10px);border-radius:14px;box-shadow:inset 0 0 0 1px var(--line)}
#ctrl button{font-size:1.75vh;padding:1vh 1.2vw}
#ctrl .info{font-size:1.6vh;color:var(--mute);padding:0 .8vw}

/* lobby */
#lobby{position:absolute;left:0;top:0;bottom:0;right:23.5vw;display:grid;grid-template-columns:auto 1fr;gap:4vw;align-items:center;padding:9vh 3vw 12vh 4vw;
  background:linear-gradient(90deg,rgba(12,20,38,.94) 0%,rgba(12,20,38,.82) 55%,rgba(12,20,38,.55) 100%)}
#lobby .jn{display:grid;gap:2vh;justify-items:start}
#lobby .ev{font-family:var(--fd);font-weight:800;font-size:6.4vh;line-height:.92;max-width:11em}
#lobby .how{color:var(--soft);font-size:2vh;line-height:1.5;max-width:22em}
#qr{background:#fff;padding:1.6vh;border-radius:14px;line-height:0}
#qr img,#qr canvas{width:27vh!important;height:27vh!important;display:block}
#lobby .cd{display:flex;align-items:baseline;gap:1vw}
#lobby .cd span{font-size:1.8vh;color:var(--mute)}
#lobby .cd b{font-family:var(--fd);font-weight:700;font-size:6vh;letter-spacing:.2em;color:var(--gold)}
#lobby .url{font-size:1.45vh;color:var(--mute);word-break:break-all;max-width:34vh}
#lobby .tl{display:grid;grid-template-columns:repeat(auto-fill,minmax(22vh,1fr));gap:1.6vh 1.4vw;align-content:center;max-height:100%;overflow:auto;padding-right:.5vw}
.tc{border-top:3px solid var(--c);padding-top:1.2vh}
.tc .hd{display:flex;justify-content:space-between;align-items:baseline}
.tc b{font-family:var(--fd);font-weight:700;font-size:2.7vh}
.tc .ct{font-family:var(--fd);font-size:2.2vh;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:.6vh;margin-top:1vh;min-height:3vh}
.chip{background:rgba(255,255,255,.07);border-radius:6px;padding:.35vh .9vh;font-size:1.55vh}
.chip.off{opacity:.35}
.empty{font-size:1.5vh;color:var(--mute)}

/* overlays */
#stage{position:absolute;left:0;right:23.5vw;top:0;bottom:0;pointer-events:none}
.intro{position:absolute;left:2.4vw;top:6vh;max-width:56vw;display:grid;grid-template-columns:1fr auto;column-gap:3vw;align-items:end}
.intro>div{min-width:0}
.intro .ty{font-family:var(--fd);font-weight:600;font-size:2.6vh;color:var(--gold)}
.intro h2{font-family:var(--fd);font-weight:800;font-size:9.5vh;line-height:.88;margin-top:1vh;text-shadow:0 4px 40px rgba(8,14,30,.6)}
.intro p{font-size:2.6vh;color:var(--soft);margin:2vh 0 0;max-width:24em;line-height:1.45}
.intro .cdn{font-family:var(--fd);font-weight:700;font-size:18vh;line-height:.8;color:var(--gold);font-variant-numeric:tabular-nums;animation:pulse 1s infinite}
@keyframes pulse{0%{opacity:1}70%{opacity:.55}100%{opacity:1}}
.panel{position:absolute;left:50%;transform:translateX(-50%);background:rgba(10,17,33,.86);backdrop-filter:blur(16px);border-radius:18px;box-shadow:inset 0 0 0 1px var(--line),0 30px 80px rgba(4,8,20,.5)}
.quiz{bottom:11vh;width:min(64vw,92vh*1.2);padding:3.2vh 2.6vw}
.quiz .qh{display:flex;justify-content:space-between;color:var(--mute);font-size:1.8vh;margin-bottom:1.4vh}
.quiz .qh b{font-family:var(--fd);color:var(--gold);font-size:2.2vh;font-weight:600}
.quiz .q{font-size:3.6vh;font-weight:600;line-height:1.25}
.quiz .op{display:grid;grid-template-columns:1fr 1fr;gap:1.2vh;margin-top:2.6vh}
.quiz .o{display:flex;align-items:center;gap:1.2vw;background:rgba(255,255,255,.05);border-radius:10px;padding:1.5vh 1.2vw;font-size:2.5vh;font-weight:500;box-shadow:inset 0 0 0 1px var(--line);transition:opacity .4s,background .4s}
.quiz .o i{font-style:normal;font-family:var(--fd);font-weight:700;width:4vh;height:4vh;border-radius:7px;display:grid;place-items:center;background:rgba(255,255,255,.08);flex:none}
.quiz .o.ok{background:rgba(60,203,142,.16);box-shadow:inset 0 0 0 1.5px var(--ok)}
.quiz .o.ok i{background:var(--ok);color:var(--ink)}
.quiz .o.no{opacity:.32}
.quiz .an{margin-top:2vh;font-size:1.8vh;color:var(--mute)}
.res{top:50%;transform:translate(-50%,-50%);padding:3.6vh 3vw;width:min(54vw,90vh)}
.res h2{font-family:var(--fd);font-weight:800;font-size:6vh;line-height:1}
.res .sub{color:var(--mute);font-size:1.9vh;margin-top:.6vh}
.gl{display:grid;gap:.6vh;margin-top:2.6vh}
.gl div{display:grid;grid-template-columns:3vh 4px 1fr auto auto;gap:1vw;align-items:center;font-size:2.4vh;padding:.8vh 0;border-bottom:1px solid var(--line)}
.gl div:last-child{border-bottom:0}
.gl .p{font-family:var(--fd);font-weight:700;color:var(--mute)}
.gl .c{height:3vh;background:var(--c);border-radius:2px}
.gl .n{font-weight:600}
.gl .g{font-family:var(--fd);color:var(--ok);font-size:2.2vh}
.gl .t{font-family:var(--fd);font-weight:700;min-width:6vh;text-align:right}
.win{top:50%;transform:translate(-50%,-50%);padding:5vh 3.4vw;width:min(58vw,96vh);text-align:left}
.win .lb{font-family:var(--fd);font-size:2.6vh;color:var(--gold);font-weight:600}
.win h2{font-family:var(--fd);font-weight:800;font-size:12vh;line-height:.9;margin-top:.6vh}
.win .bar{height:6px;width:16vh;background:var(--c);border-radius:3px;margin:2.4vh 0 1vh}

/* ---------- ADMIN ---------- */
#admin{overflow:auto;background:var(--ink)}
#admin .top{position:sticky;top:0;z-index:3;background:rgba(12,20,38,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
#admin .top .in{max-width:1080px;margin:auto;padding:14px 28px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#admin .top h1{font-family:var(--fd);font-size:26px;font-weight:700;flex:1;min-width:200px}
#admin .top button{font-size:14px;padding:.6em 1em}
#admin main{max-width:1080px;margin:auto;padding:12px 28px 80px}
#admin .intro-t{color:var(--mute);font-size:14px;line-height:1.55;max-width:46em;margin:18px 0 8px}
.sec{display:grid;grid-template-columns:240px 1fr;gap:32px;padding:30px 0;border-bottom:1px solid var(--line)}
.sec>div:first-child h2{font-family:var(--fd);font-size:24px;font-weight:700}
.sec>div:first-child p{color:var(--mute);font-size:13.5px;line-height:1.55;margin:6px 0 0}
.fg{display:grid;gap:14px 16px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
#admin label{font-size:12.5px;color:var(--soft);display:block;margin-bottom:6px;font-weight:500}
.it{background:var(--ink2);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:inset 0 0 0 1px var(--line)}
.it .hd{display:flex;gap:6px;align-items:center;margin-bottom:12px}
.it .hd b{flex:1;font-family:var(--fd);font-size:19px;font-weight:700}
.it .hd .ty{font-size:12px;color:var(--mute);font-weight:500;font-family:var(--fb);margin-left:8px}
.mini{padding:.35em .75em;font-size:13px;border-radius:7px}
.danger{color:#FFB4B6!important}
.opr{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:center;margin-top:8px}
.opr input[type=radio]{width:18px;height:18px;accent-color:var(--ok)}
input[type=color]{padding:3px;height:40px;cursor:pointer}
#saved{color:var(--ok);font-weight:600;font-size:14px}
@media(max-width:760px){.sec{grid-template-columns:1fr;gap:14px}}

/* ---------- PHONE ---------- */
#phone{display:flex;flex-direction:column;--c:#2F5BEA;
  background:radial-gradient(120% 60% at 50% -10%,color-mix(in srgb,var(--c) 45%,transparent) 0%,transparent 70%),var(--ink)}
#phead{display:flex;align-items:center;gap:12px;padding:16px 20px 12px}
#phead .me{flex:1;min-width:0}
#phead .me b{display:block;font-family:var(--fd);font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#phead .me span{font-size:13px;color:var(--soft)}
#phead .st{text-align:right}
#phead .st b{font-family:var(--fd);font-size:26px;font-weight:700;display:block;line-height:1}
#phead .st span{font-size:12px;color:var(--mute)}
#pbody{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:12px 22px 22px;overflow:auto}
#pbody .k{font-family:var(--fd);font-weight:600;font-size:18px;color:var(--gold)}
#pbody h2{font-family:var(--fd);font-weight:800;font-size:44px;line-height:.92}
#pbody p{color:var(--soft);margin:0;font-size:16px;line-height:1.5}
#pbody input{font-size:20px;padding:.8em .9em;border-radius:12px}
#pbody .cta{font-size:18px;width:100%;padding:1em;border-radius:14px}
#pbody .ctr{text-align:center;align-items:center}
.sens{display:grid;gap:8px}
.sens div{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.05);border-radius:12px;padding:12px 14px;font-size:15px}
.sens em{font-style:normal;font-size:13px;color:var(--mute)}
.sens em.on{color:var(--ok)}
.tp{display:grid;gap:8px}
.tp button{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.05);color:var(--snow);text-align:left;font-weight:500;border-radius:12px;padding:12px 14px;box-shadow:inset 0 0 0 1px var(--line)}
.tp button i{width:14px;height:14px;border-radius:4px;background:var(--tc);flex:none}
.tp button span{flex:1}
.tp button.sel{box-shadow:inset 0 0 0 1.5px var(--tc);background:rgba(255,255,255,.09)}
.wait{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:14px}
.wait i{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:pulse 1.2s infinite}
#padw{position:relative;width:min(80vw,58vh);aspect-ratio:1;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none}
#padw svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
#pad{position:absolute;inset:9%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--c) 85%,#fff) 0%,var(--c) 55%,color-mix(in srgb,var(--c) 70%,#000) 100%);
  box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 -6px 18px rgba(0,0,0,.25);transition:transform .06s}
#pad b{font-family:var(--fd);font-weight:800;font-size:64px;line-height:1;color:#fff}
#pad small{font-size:14px;color:rgba(255,255,255,.85);margin-top:4px}
#pad.hit{transform:scale(.95)}
.ptm{font-family:var(--fd);font-weight:700;font-size:40px;text-align:center;font-variant-numeric:tabular-nums}
.ptm span{font-size:15px;color:var(--mute);font-family:var(--fb);font-weight:400;margin-left:6px}
.pq{font-size:21px;font-weight:600;line-height:1.35}
.po{display:grid;gap:10px}
.po button{display:flex;gap:12px;align-items:center;text-align:left;background:rgba(255,255,255,.05);color:var(--snow);font-weight:500;padding:15px 14px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line)}
.po button i{font-style:normal;font-family:var(--fd);font-weight:700;width:30px;height:30px;border-radius:7px;display:grid;place-items:center;background:rgba(255,255,255,.08);flex:none}
.po button.sel{box-shadow:inset 0 0 0 1.5px var(--c);background:color-mix(in srgb,var(--c) 22%,transparent)}
.po button.ok{box-shadow:inset 0 0 0 1.5px var(--ok);background:rgba(60,203,142,.16)}
.po button.ok i{background:var(--ok);color:var(--ink)}
.po button.no{box-shadow:inset 0 0 0 1.5px var(--bad);background:rgba(240,86,91,.14)}
.po button:disabled{opacity:1}
.verdict{font-family:var(--fd);font-weight:800;font-size:34px}.verdict.ok{color:var(--ok)}.verdict.no{color:var(--bad)}
.big{font-family:var(--fd);font-weight:800;font-size:110px;line-height:.85;font-variant-numeric:tabular-nums}
.prog{height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--c)}
#pstat{padding:10px 20px 14px;font-size:12.5px;color:var(--mute);display:flex;gap:8px;align-items:center;justify-content:center}
#pstat i{width:7px;height:7px;border-radius:50%;background:var(--mute)}
#pstat.on i{background:var(--ok)}
</style>
</head>
<body>

<div id="menu" class="screen hide">
  <svg viewBox="0 0 1440 600" preserveAspectRatio="none" aria-hidden="true">
    <path fill="#8B86AE" d="M0 330 L120 260 L230 300 L360 190 L470 270 L600 210 L720 280 L860 170 L980 250 L1100 200 L1240 270 L1440 210 L1440 600 L0 600Z"/>
    <path fill="#4F578A" d="M0 400 L150 320 L280 370 L420 280 L560 360 L700 300 L840 380 L990 290 L1130 360 L1280 300 L1440 350 L1440 600 L0 600Z"/>
    <path fill="#2A3664" d="M0 470 L180 400 L340 450 L520 380 L700 450 L880 390 L1060 460 L1240 400 L1440 440 L1440 600 L0 600Z"/>
    <path fill="#0F1A36" d="M0 540 L260 480 L520 520 L800 470 L1100 520 L1440 480 L1440 600 L0 600Z"/>
  </svg>
  <div class="in">
    <div class="kicker">Team game</div>
    <h1>Trail Summit<br>Challenge</h1>
    <p>Balapan trail tim menuju puncak. Buka layar ini di laptop atau proyektor, lalu pemain bergabung dari HP dengan scan QR.</p>
    <div class="row">
      <button onclick="go('host')">Buka layar host</button>
      <button class="ghost" onclick="go('admin')">Atur challenge</button>
    </div>
  </div>
</div>

<div id="host" class="screen hide">
  <canvas id="cv"></canvas>
  <div id="hud"></div>
  <div id="stage"></div>
  <div id="lobby"></div>
  <div id="tower"></div>
  <div id="roomtag" class="hide"></div>
  <div id="warn" class="hide"></div>
  <div id="ctrl">
    <button id="bMain"></button>
    <button class="ghost" id="bSkip">Lewati</button>
    <button class="ghost" id="bBot">Tambah bot</button>
    <span class="info" id="hInfo"></span>
    <button class="ghost" id="bFull">Layar penuh</button>
    <button class="ghost" id="bReset">Reset</button>
    <button class="ghost" onclick="go('admin')">Admin</button>
  </div>
</div>

<div id="admin" class="screen hide"></div>

<div id="phone" class="screen hide">
  <div id="phead"><div class="me"><b id="pname">Trail Summit</b><span id="pteam">Menghubungkan</span></div><div class="st" id="pst"></div></div>
  <div id="pbody"></div>
  <div id="pstat"><i></i><span id="pstt">Menghubungkan…</span></div>
</div>

<script>
'use strict';
/* ===================== UTIL & CONFIG ===================== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const QS=new URLSearchParams(location.search);
const LOCAL=QS.has('local')||typeof Peer==='undefined';
const PREFIX='trailsummit-';
const TYPES={tap:'Tap cepat',shout:'Teriak',shake:'Goyang HP',quiz:'Kuis'};
const COLORS=['#2F5BEA','#E5484D','#30A46C','#F5A524','#8E4EC6','#12A594','#D6409F','#8DB600','#F76B15','#E6E8EC'];
const TNAMES=['Biru','Merah','Hijau','Kuning','Ungu','Tosca','Pink','Lime','Oranye','Putih'];
const DEFAULT_CFG={
  title:'Trail Summit Challenge',teamCount:4,pick:true,trackPct:55,micSens:1,shakeSens:1,tapMax:8,
  teams:TNAMES.map((n,i)=>({name:'Tim '+n,color:COLORS[i]})),
  rounds:[
    {type:'tap',title:'Geber dari start',desc:'Tap tombol gas secepat mungkin.',dur:20,pts:20,qCount:3,qTime:15},
    {type:'shout',title:'Tanjakan yel-yel',desc:'Teriakkan yel-yel tim sekeras mungkin.',dur:20,pts:25,qCount:3,qTime:15},
    {type:'quiz',title:'Pos kuis',desc:'Jawab dengan benar dan secepat mungkin.',dur:20,pts:25,qCount:3,qTime:15},
    {type:'shake',title:'Jalur berbatu',desc:'Goyangkan HP sekuat tenaga.',dur:20,pts:30,qCount:3,qTime:15}
  ],
  quiz:[
    {q:'Perlengkapan yang paling wajib dipakai saat berkendara motor?',opts:['Helm','Jaket','Sarung tangan','Kacamata'],a:0},
    {q:'Gunung tertinggi di Pulau Jawa adalah…',opts:['Merapi','Semeru','Slamet','Lawu'],a:1},
    {q:'Kunci utama kerja tim yang baik adalah…',opts:['Bekerja sendiri','Saling menyalahkan','Komunikasi','Diam saja'],a:2},
    {q:'Sebelum menanjak, yang perlu dicek pertama kali?',opts:['Warna motor','Stiker','Klakson','Rem dan ban'],a:3},
    {q:'Gunung tertinggi di Indonesia adalah…',opts:['Puncak Jaya','Kerinci','Rinjani','Semeru'],a:0},
    {q:'K3 adalah singkatan dari…',opts:['Kerja Keras Kompak','Keselamatan dan Kesehatan Kerja','Kualitas Kerja Karyawan','Kendali Kualitas Kerja'],a:1}
  ]
};
function loadCfg(){let c={};try{c=JSON.parse(localStorage.getItem('trail_cfg')||'{}')}catch(e){}return normCfg(c)}
function normCfg(c){
  const d=JSON.parse(JSON.stringify(DEFAULT_CFG));
  const o=Object.assign(d,c||{});
  if(!Array.isArray(o.teams))o.teams=d.teams;
  while(o.teams.length<10)o.teams.push({name:'Tim '+TNAMES[o.teams.length],color:COLORS[o.teams.length]});
  o.teamCount=clamp(parseInt(o.teamCount)||4,1,10);
  if(!Array.isArray(o.rounds)||!o.rounds.length)o.rounds=JSON.parse(JSON.stringify(DEFAULT_CFG.rounds));
  if(!Array.isArray(o.quiz))o.quiz=[];
  return o;
}
function saveCfg(c){try{localStorage.setItem('trail_cfg',JSON.stringify(c))}catch(e){}}
function show(id){['menu','host','admin','phone'].forEach(s=>$(s).classList.toggle('hide',s!==id))}
function go(v){location.hash=v;route()}
let hostStarted=false;
function route(){
  if(QS.get('j')){show('phone');Phone.init(QS.get('j').toUpperCase());return}
  const h=location.hash.slice(1);
  if(h==='host'){show('host');if(!hostStarted){hostStarted=true;Host.init()}else Host.reloadCfg()}
  else if(h==='admin'){show('admin');Admin.render()}
  else show('menu');
}
window.addEventListener('hashchange',route);

/* ===================== NETWORK ===================== */
function HostNet(room,onMsg,onStatus){
  const conns={};let bc=null,peer=null;
  if(LOCAL){
    bc=new BroadcastChannel(PREFIX+room);
    bc.onmessage=e=>{const d=e.data;if(d&&d.from)onMsg(d.from,d.msg)};
    onStatus('ok');
  }else{
    peer=new Peer(PREFIX+room);
    peer.on('open',()=>onStatus('ok'));
    peer.on('connection',c=>{c.on('data',d=>{if(d&&d.pid){conns[d.pid]=c;onMsg(d.pid,d)}})});
    peer.on('disconnected',()=>{onStatus('Koneksi server terputus, menyambung ulang…');try{peer.reconnect()}catch(e){}});
    peer.on('error',e=>{
      if(e.type==='unavailable-id')onStatus('Kode room sedang dipakai tab lain. Tutup tab host lain lalu muat ulang.');
      else if(e.type!=='peer-unavailable')onStatus('Gangguan koneksi ('+e.type+')');
    });
  }
  return{
    send(pid,msg){if(bc)bc.postMessage({to:pid,msg});else{const c=conns[pid];if(c&&c.open)try{c.send(msg)}catch(e){}}},
    broadcast(msg){if(bc)bc.postMessage({to:'*',msg});else for(const k in conns){const c=conns[k];if(c.open)try{c.send(msg)}catch(e){}}}
  };
}
function PhoneNet(room,pid,onMsg,onStatus){
  let bc=null,peer=null,conn=null,retry=null;
  if(LOCAL){
    bc=new BroadcastChannel(PREFIX+room);
    bc.onmessage=e=>{const d=e.data;if(d&&(d.to===pid||d.to==='*'))onMsg(d.msg)};
    setTimeout(()=>onStatus(true),50);
  }else{
    const connect=()=>{
      if(!peer||peer.destroyed)return;
      conn=peer.connect(PREFIX+room,{reliable:true});
      conn.on('open',()=>onStatus(true));
      conn.on('data',onMsg);
      conn.on('close',()=>{onStatus(false);sched()});
      conn.on('error',()=>{onStatus(false);sched()});
    };
    const sched=()=>{clearTimeout(retry);retry=setTimeout(()=>{if(!conn||!conn.open)connect()},2000)};
    const mk=()=>{
      peer=new Peer();
      peer.on('open',connect);
      peer.on('disconnected',()=>{onStatus(false);try{peer.reconnect()}catch(e){}});
      peer.on('error',e=>{onStatus(false,e.type);if(e.type==='peer-unavailable')sched();else if(e.type==='network'||e.type==='server-error'){try{peer.destroy()}catch(x){}setTimeout(mk,2500)}});
    };mk();
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&(!conn||!conn.open))sched()});
  }
  return{send(msg){msg.pid=pid;if(bc)bc.postMessage({from:pid,msg});else if(conn&&conn.open)try{conn.send(msg)}catch(e){}}};
}

/* ===================== HOST ===================== */
const Host=(()=>{
  let cfg,net,room,cv,cx,W=0,H=0,DPR=1,bgC=null,fgC=null;
  const P={};
  let T=[];
  const G={phase:'lobby',ri:-1,timer:0,tmax:1,q:null,qi:0,qn:1,qPtr:0,finish:0,trackLen:1,time:0,parts:[]};
  const TW=.235; // timing tower share of width

  function init(){
    cfg=loadCfg();
    room=sessionStorage.getItem('trail_room');
    if(!room){room=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('');sessionStorage.setItem('trail_room',room)}
    cv=$('cv');cx=cv.getContext('2d');
    addEventListener('resize',resize);resize();
    net=HostNet(room,onMsg,s=>{const w=$('warn');if(s==='ok'){if(!LOCAL)w.classList.add('hide')}else{w.textContent=s;w.classList.remove('hide')}});
    if(LOCAL){$('warn').textContent='Mode demo lokal: HP hanya bisa bergabung dari browser yang sama.';$('warn').classList.remove('hide')}
    resetTeams();
    $('bMain').onclick=mainBtn;$('bSkip').onclick=skip;$('bBot').onclick=addBot;
    $('bReset').onclick=toLobby;
    $('bFull').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
    addEventListener('keydown',e=>{if(e.code==='Space'&&!$('host').classList.contains('hide')&&e.target.tagName!=='BUTTON'){e.preventDefault();mainBtn()}});
    if(document.fonts)document.fonts.ready.then(()=>{bgC=null});
    drawLobby();ui();
    let last=performance.now();
    (function loop(now){const dt=Math.min(.1,Math.max(0,(now-last)/1000));last=now;update(dt);render(dt);requestAnimationFrame(loop)})(last);
    setInterval(()=>{const now=performance.now();if(now-last>400){const dt=Math.min(1.5,(now-last)/1000);last=now;update(dt)}},250);
    setInterval(()=>{net.broadcast({t:'st',teams:T.map(t=>({f:+frac(t).toFixed(3),r:t.rank}))})},1000);
    setInterval(()=>{if(G.phase==='lobby')net.broadcast(pub())},3000);
  }
  function reloadCfg(){if(G.phase==='lobby'){cfg=loadCfg();resetTeams();for(const k in P)if(P[k].team>=cfg.teamCount)P[k].team=smallest();drawLobby();ui();net.broadcast(pub());for(const k in P)sendMe(k)}}
  function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;bgC=null}
  function resetTeams(){
    T=cfg.teams.slice(0,cfg.teamCount).map((t,i)=>({i,name:t.name,color:t.color,p:0,r0:0,disp:0,int:0,wheel:0,fin:0,rank:i+1,spd:0}));
    const tot=cfg.rounds.reduce((s,r)=>s+(+r.pts||0),0)||1;
    G.trackLen=tot*clamp((+cfg.trackPct||55)/100,.2,1);G.finish=0;G.qPtr=0;G.parts=[];bgC=null;
  }
  const frac=t=>clamp(t.disp/G.trackLen);
  const members=i=>Object.values(P).filter(p=>p.team===i);
  const online=p=>p.bot||performance.now()-p.last<6000;
  function smallest(){let b=0,bn=1e9;for(let i=0;i<cfg.teamCount;i++){const n=members(i).length;if(n<bn){bn=n;b=i}}return b}
  function ranking(){
    const a=T.filter(t=>G.phase==='lobby'||members(t.i).length).slice().sort((x,y)=>(x.fin||99)-(y.fin||99)||y.p-x.p);
    a.forEach((t,k)=>t.rank=k+1);return a;
  }
  function pub(){
    const r=cfg.rounds[G.ri];
    return{t:'s',phase:G.phase,ri:G.ri,n:cfg.rounds.length,title:cfg.title,pick:!!cfg.pick,
      round:r?{type:r.type,title:r.title,desc:r.desc}:null,left:Math.max(0,G.timer*1000|0),
      q:G.q?{text:G.q.q,opts:G.q.opts,i:G.qi,n:G.qn}:null,ans:G.phase==='reveal'&&G.q?G.q.a:null,
      sens:{mic:+cfg.micSens||1,shake:+cfg.shakeSens||1,tap:+cfg.tapMax||8},
      teams:T.map(t=>({name:t.name,color:t.color,r:t.rank,f:+frac(t).toFixed(3)}))};
  }
  function sendMe(pid){const p=P[pid];if(p&&!p.bot)net.send(pid,{t:'me',team:p.team,name:p.name})}
  function setPhase(ph,timer){G.phase=ph;G.timer=timer||0;G.tmax=timer||1;ranking();net.broadcast(pub());ui()}

  function onMsg(pid,m){
    let p=P[pid];
    if(m.t==='join'){
      if(!p){
        if(Object.keys(P).length>=50){net.send(pid,{t:'full'});return}
        p=P[pid]={name:String(m.name||'Pemain').slice(0,16),team:smallest(),v:0,last:performance.now(),ans:null};
      }else if(m.name)p.name=String(m.name).slice(0,16);
      p.last=performance.now();
      sendMe(pid);net.send(pid,pub());
      if(G.phase==='lobby')drawLobby();
      return;
    }
    if(!p){net.send(pid,{t:'who'});return}
    p.last=performance.now();
    if(m.t==='v')p.v=clamp(+m.v||0);
    else if(m.t==='team'&&G.phase==='lobby'&&cfg.pick){const i=m.team|0;if(i>=0&&i<cfg.teamCount){p.team=i;sendMe(pid);drawLobby()}}
    else if(m.t==='ans'&&G.phase==='q'&&p.ans==null&&m.q===G.qi){p.ans=m.a|0;p.ansLeft=G.timer/(G.qTime||1)}
  }
  let botN=0;
  function addBot(){
    if(Object.keys(P).length>=50)return;
    const id='bot'+(++botN);P[id]={name:'Bot '+botN,team:smallest(),v:0,last:0,ans:null,bot:true,skill:.35+Math.random()*.55};
    if(G.phase==='lobby')drawLobby();
  }

  /* ---- flow ---- */
  function mainBtn(){
    if(G.phase==='lobby'){if(Object.keys(P).length)start()}
    else if(G.phase==='result')nextRound();
    else if(G.phase==='end')toLobby();
  }
  function skip(){if(['intro','play','q','reveal'].includes(G.phase))G.timer=0}
  function toLobby(){cfg=loadCfg();resetTeams();G.ri=-1;G.q=null;for(const k in P){P[k].v=0;if(P[k].team>=cfg.teamCount)P[k].team=smallest()}setPhase('lobby');drawLobby();for(const k in P)sendMe(k)}
  function start(){resetTeams();G.ri=-1;nextRound()}
  function nextRound(){
    G.ri++;G.q=null;
    if(G.ri>=cfg.rounds.length||T.every(t=>t.fin||!members(t.i).length)){setPhase('end');return}
    for(const k in P)P[k].v=0;
    T.forEach(t=>t.r0=t.p);
    setPhase('intro',5);
  }
  function startQ(){
    const r=cfg.rounds[G.ri];
    if(!cfg.quiz.length){setPhase('result');return}
    G.q=cfg.quiz[G.qPtr%cfg.quiz.length];G.qPtr++;G.qTime=+r.qTime||15;
    for(const k in P){const p=P[k];p.ans=null;p.ansLeft=0;if(p.bot)p.botAt=G.qTime*(.25+Math.random()*.6)}
    setPhase('q',G.qTime);
  }
  function reveal(){
    const r=cfg.rounds[G.ri],max=(+r.pts||0)/G.qn;
    T.forEach(t=>{const ms=members(t.i).filter(online);if(!ms.length||t.fin)return;
      const sc=ms.reduce((s,p)=>s+(p.ans===G.q.a?.5+.5*clamp(p.ansLeft):0),0)/ms.length;
      t.p+=max*sc});
    checkFinish();setPhase('reveal',5);
  }
  function checkFinish(){T.forEach(t=>{if(!t.fin&&t.p>=G.trackLen){t.p=G.trackLen;t.fin=++G.finish}})}
  function update(dt){
    G.time+=dt;const r=cfg.rounds[G.ri];
    if(['intro','play','q','reveal'].includes(G.phase))G.timer-=dt;
    if(G.phase==='play'){
      const now=performance.now();
      T.forEach(t=>{
        const ms=members(t.i).filter(online);let s=0;
        ms.forEach(p=>{
          if(p.bot)p.v=clamp(p.v+(Math.random()-.5)*.25+(p.skill-p.v)*.08);
          else if(now-p.last>1500)p.v=0;
          s+=p.v});
        const target=ms.length?s/ms.length:0;
        t.int+=(target-t.int)*Math.min(1,dt*6);
        if(!t.fin)t.p+=t.int*(+r.pts||0)/(+r.dur||20)*dt;
      });
      checkFinish();
      if(G.timer<=0||T.every(t=>t.fin||!members(t.i).length)){T.forEach(t=>t.int=0);setPhase('result')}
    }else{
      T.forEach(t=>t.int*=Math.pow(.02,dt));
      if(G.phase==='intro'&&G.timer<=0){
        if(r.type==='quiz'){G.qi=0;G.qn=Math.max(1,Math.min(+r.qCount||1,cfg.quiz.length||1));startQ()}
        else setPhase('play',+r.dur||20);
      }else if(G.phase==='q'){
        const hum=Object.values(P).filter(online);
        hum.forEach(p=>{if(p.bot&&p.ans==null&&G.qTime-G.timer>p.botAt){p.ans=Math.random()<p.skill?G.q.a:(Math.random()*4|0);p.ansLeft=G.timer/G.qTime}});
        if(G.timer<=0||(hum.length&&hum.every(p=>p.ans!=null)))reveal();
      }else if(G.phase==='reveal'&&G.timer<=0){
        G.qi++;
        if(G.qi<G.qn&&!T.every(t=>t.fin||!members(t.i).length))startQ();else{G.q=null;setPhase('result')}
      }
    }
    T.forEach(t=>{const d=t.p-t.disp;const mv=d*Math.min(1,dt*3);t.disp+=mv;t.spd=mv/Math.max(dt,.001);t.wheel+=mv*1.6+t.int*dt*5});
    ranking();
    hudTick();
  }

  /* ---- DOM UI ---- */
  const pct=t=>Math.round(clamp(t.p/G.trackLen)*100);
  function ui(){
    const r=cfg.rounds[G.ri],ph=G.phase;
    $('lobby').classList.toggle('hide',ph!=='lobby');
    $('hud').classList.toggle('hide',ph==='lobby'||ph==='end'||ph==='intro');
    $('hud').innerHTML=r?`<div class="ev">${esc(cfg.title)}</div><div class="rn">Ronde ${G.ri+1} dari ${cfg.rounds.length}</div><div class="rt">${esc(r.title)}</div>
      <div id="tmw" class="${ph==='play'||ph==='q'?'':'hide'}"><div class="tm"><b id="hTime"></b><span>detik</span></div><div class="tb"><i id="hBar"></i></div></div>`:'';
    $('bMain').textContent=ph==='lobby'?'Mulai game':ph==='result'?(G.ri+1>=cfg.rounds.length?'Lihat pemenang':'Ronde berikutnya'):ph==='end'?'Kembali ke lobby':'Ronde berjalan';
    $('bMain').disabled=!['lobby','result','end'].includes(ph);
    $('bSkip').classList.toggle('hide',!['intro','play','q','reveal'].includes(ph));
    $('bBot').classList.toggle('hide',ph!=='lobby');
    const rt=$('roomtag');rt.classList.toggle('hide',ph==='lobby');rt.innerHTML=`Kode room<b>${room}</b>`;
    let h='';
    if(ph==='intro')h=`<div class="intro"><div><div class="ty">Ronde ${G.ri+1} dari ${cfg.rounds.length}, ${esc(TYPES[r.type]).toLowerCase()}</div><h2>${esc(r.title)}</h2><p>${esc(r.desc)}</p></div><div class="cdn" id="cBig"></div></div>`;
    else if(ph==='q'||ph==='reveal'){
      h=`<div class="panel quiz"><div class="qh"><b>Soal ${G.qi+1} dari ${G.qn}</b><span id="cAns"></span></div><div class="q">${esc(G.q.q)}</div><div class="op">`+
        G.q.opts.map((o,i)=>`<div class="o ${ph==='reveal'?(i===G.q.a?'ok':'no'):''}"><i>${'ABCD'[i]}</i>${esc(o)}</div>`).join('')+`</div></div>`;
    }else if(ph==='result'){
      const a=ranking();
      h=`<div class="panel res"><h2>Ronde ${G.ri+1} selesai</h2><div class="sub">Jarak yang ditempuh tiap tim di ronde ini</div><div class="gl">`+
        a.map((t,k)=>`<div style="--c:${t.color}"><span class="p">${k+1}</span><span class="c"></span><span class="n">${esc(t.name)}</span><span class="g">+${Math.round((t.p-t.r0)/G.trackLen*100)}%</span><span class="t">${t.fin?'Puncak':pct(t)+'%'}</span></div>`).join('')+`</div></div>`;
    }else if(ph==='end'){
      const a=ranking(),w=a[0];
      h=w?`<div class="panel win" style="--c:${w.color}"><div class="lb">Juara ${esc(cfg.title)}</div><h2>${esc(w.name)}</h2><div class="bar"></div><div class="gl">`+
        a.slice(1).map((t,k)=>`<div style="--c:${t.color}"><span class="p">${k+2}</span><span class="c"></span><span class="n">${esc(t.name)}</span><span></span><span class="t">${t.fin?'Puncak':pct(t)+'%'}</span></div>`).join('')+`</div></div>`:'';
    }
    $('stage').innerHTML=h;
    tower(true);
  }
  let towerKey='';
  function tower(force){
    const a=ranking(),key=a.map(t=>t.i).join()+G.phase;
    if(force||key!==towerKey){
      towerKey=key;
      const r=cfg.rounds[G.ri];
      $('tower').innerHTML=`<div class="th"><b>Klasemen</b><span>${G.phase==='lobby'?Object.keys(P).length+' pemain':r&&G.phase!=='end'?'Ronde '+(G.ri+1)+'/'+cfg.rounds.length:'Final'}</span></div>`+
        a.map(t=>`<div class="row ${t.rank===1&&G.phase!=='lobby'?'lead':''}" style="--c:${t.color}"><span class="ps">${t.rank}</span><span class="cb"></span><div><div class="nm">${esc(t.name)}</div><div class="sb">${members(t.i).length} pemain</div></div><span class="pc" id="pc${t.i}"></span><div class="pw"><i id="pw${t.i}"></i></div></div>`).join('');
    }
    a.forEach(t=>{const e=$('pc'+t.i);if(e){e.textContent=t.fin?'Puncak':Math.round(frac(t)*100)+'%';$('pw'+t.i).style.width=(t.int*100)+'%'}});
  }
  function hudTick(){
    const ph=G.phase,s=Math.max(0,Math.ceil(G.timer));
    const ht=$('hTime');if(ht){ht.textContent=s;$('hBar').style.width=clamp(G.timer/G.tmax)*100+'%'}
    const b=$('cBig');if(b)b.textContent=s;
    const ca=$('cAns');if(ca&&ph==='q'){const hum=Object.values(P).filter(online);ca.textContent=hum.filter(p=>p.ans!=null).length+' dari '+hum.length+' sudah menjawab'}
    $('hInfo').textContent=Object.keys(P).length+' pemain';
    tower(false);
  }
  function drawLobby(){
    const url=location.origin+location.pathname+'?j='+room+(QS.has('local')?'&local=1':'');
    let teams='';
    for(let i=0;i<cfg.teamCount;i++){const t=cfg.teams[i],ms=members(i);
      teams+=`<div class="tc" style="--c:${t.color}"><div class="hd"><b>${esc(t.name)}</b><span class="ct">${ms.length}</span></div><div class="chips">${ms.length?ms.map(p=>`<span class="chip ${online(p)?'':'off'}">${esc(p.name)}</span>`).join(''):'<span class="empty">Belum ada pemain</span>'}</div></div>`}
    $('lobby').innerHTML=`<div class="jn"><div class="ev">${esc(cfg.title)}</div><div class="how">Buka kamera HP, scan kode ini, lalu isi nama kamu.</div><div id="qr"></div><div class="cd"><span>Kode room</span><b>${room}</b></div><div class="url">${esc(url)}</div></div><div class="tl">${teams}</div>`;
    try{if(typeof QRCode!=='undefined')new QRCode($('qr'),{text:url,width:512,height:512,colorDark:'#0C1426',correctLevel:QRCode.CorrectLevel.M});else $('qr').innerHTML='<div style="color:#0C1426;line-height:1.4;padding:2vh;font-size:1.7vh;width:27vh">QR tidak termuat. Buka alamat di bawah dari HP.</div>'}catch(e){}
    T.forEach(t=>{const c=cfg.teams[t.i];t.name=c.name;t.color=c.color});tower(true);
  }

  /* ---- CANVAS ---- */
  const mw=()=>W*(1-TW);
  function gx(u){return mw()*.06+u*mw()*.8}
  function gy(u){const c=clamp(u),env=Math.sin(Math.PI*c);
    return H*.86-H*.6*Math.pow(c,1.15)+H*.016*env*(Math.sin(c*24)+.6*Math.sin(c*53+1.3))+(u>1?Math.pow((u-1)*9,2.2)*H*.06:0)+(u<0?-u*H*.25:0)}
  function rnd(seed){let s=seed;return()=>((s=Math.imul(s,1664525)+1013904223|0)>>>0)/4294967296}
  function ridgeY(x,seed,base,amp){
    const f=x/W;
    const n=.55*Math.sin(f*7.1+seed)+.3*Math.sin(f*15.3+seed*2.1)+.15*Math.sin(f*31.7+seed*3.7);
    const pk=Math.pow((n+1)/2,1.7);
    return H*base-H*amp*pk;
  }
  function pine(c,x,y,s,col){
    c.fillStyle=col;c.beginPath();c.moveTo(x,y-s*3.2);
    for(let k=0;k<3;k++){const yy=y-s*3.2+s*(k+1)*1.0;const ww=s*(.55+k*.32);c.lineTo(x+ww,yy);c.lineTo(x+ww*.45,yy-s*.15)}
    c.lineTo(x+s*.12,y);c.lineTo(x-s*.12,y);
    for(let k=2;k>=0;k--){const yy=y-s*3.2+s*(k+1)*1.0;const ww=s*(.55+k*.32);c.lineTo(x-ww*.45,yy-s*.15);c.lineTo(x-ww,yy)}
    c.closePath();c.fill();
  }
  function buildBg(){
    bgC=document.createElement('canvas');bgC.width=W*DPR;bgC.height=H*DPR;
    const c=bgC.getContext('2d');c.setTransform(DPR,0,0,DPR,0,0);
    // sky
    const sky=c.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,'#0D1735');sky.addColorStop(.2,'#222F66');sky.addColorStop(.36,'#55508E');sky.addColorStop(.47,'#A77B9E');sky.addColorStop(.56,'#EAA68A');sky.addColorStop(.66,'#F8D2A2');sky.addColorStop(1,'#F8D2A2');
    c.fillStyle=sky;c.fillRect(0,0,W,H);
    // stars
    const sr=rnd(5);
    for(let i=0;i<140;i++){const y=sr()*H*.42;c.fillStyle=`rgba(255,255,255,${(1-y/(H*.42))*.7*sr()})`;c.fillRect(sr()*W,y,1.2,1.2)}
    // sun
    const sx=mw()*.36,sy=H*.5;
    let g=c.createRadialGradient(sx,sy,0,sx,sy,H*.55);
    g.addColorStop(0,'rgba(255,232,190,.8)');g.addColorStop(.22,'rgba(255,200,155,.3)');g.addColorStop(1,'rgba(255,190,150,0)');
    c.fillStyle=g;c.fillRect(0,0,W,H);
    c.fillStyle='#FFE9C4';c.beginPath();c.arc(sx,sy,H*.055,0,7);c.fill();
    // ranges far -> near with mist
    const L=[['#B79CB6',.6,.17,1.3,'rgba(250,205,175,.45)'],['#8577A6',.67,.16,4.2,'rgba(235,180,170,.32)'],['#4F5287',.75,.14,7.7,'rgba(180,145,170,.26)'],['#2C3667',.82,.11,2.9,'rgba(120,115,155,.22)']];
    L.forEach(([col,base,amp,seed,mist])=>{
      c.fillStyle=col;c.beginPath();c.moveTo(0,H);
      for(let x=0;x<=W+8;x+=8)c.lineTo(x,ridgeY(x,seed,base,amp));
      c.lineTo(W,H);c.closePath();c.fill();
      const m=c.createLinearGradient(0,H*(base-.06),0,H*(base+.06));m.addColorStop(0,'rgba(0,0,0,0)');m.addColorStop(1,mist);
      c.fillStyle=m;c.fillRect(0,H*(base-.06),W,H*.14);
    });
    // main mountain
    const top=gy(1);
    g=c.createLinearGradient(0,top,0,H);g.addColorStop(0,'#24335F');g.addColorStop(.35,'#17244A');g.addColorStop(1,'#0B1430');
    c.fillStyle=g;c.beginPath();c.moveTo(0,H);c.lineTo(0,gy(-.08));
    for(let u=-.08;u<=1.3;u+=.003){const x=gx(u);if(x>W+10)break;c.lineTo(x,gy(u))}
    c.lineTo(W,H);c.closePath();c.fill();
    // sunlit face (subtle)
    c.save();c.clip();
    g=c.createLinearGradient(gx(.5),0,gx(1),0);g.addColorStop(0,'rgba(255,200,160,0)');g.addColorStop(1,'rgba(255,200,160,.06)');
    c.fillStyle=g;c.fillRect(0,0,W,H);
    // snow cap
    const sn=rnd(21);
    c.beginPath();
    for(let u=.78;u<=1.12;u+=.004)c.lineTo(gx(u),gy(u)-1);
    for(let u=1.12;u>=.78;u-=.012){const d=H*(.012+.05*Math.pow(clamp((u-.78)/.25),1.2))*(.6+.6*sn());c.lineTo(gx(u),gy(u)+d)}
    c.closePath();
    g=c.createLinearGradient(0,gy(1),0,gy(.78)+H*.05);g.addColorStop(0,'rgba(236,240,250,.95)');g.addColorStop(1,'rgba(160,176,214,.35)');
    c.fillStyle=g;c.fill();
    // forest on slope
    const tr=rnd(11);
    for(let i=0;i<150;i++){const u=-.05+tr()*.72,d=H*(.035+Math.pow(tr(),.8)*.4),x=gx(u),y=gy(u)+d,s=H*(.006+.009*(d/(H*.4)))*(.8+tr()*.5);
      if(y>H+5)continue;pine(c,x,y,s,`rgba(8,14,34,${.55+.4*(d/(H*.4))})`)}
    // rocks upper
    for(let i=0;i<30;i++){const u=.55+tr()*.3,d=H*(.03+tr()*.18),x=gx(u),y=gy(u)+d,s=H*(.004+tr()*.008);
      c.fillStyle='rgba(60,72,110,.55)';c.beginPath();c.ellipse(x,y,s*1.6,s,0,0,7);c.fill()}
    c.restore();
    // foreground
    fgC=document.createElement('canvas');fgC.width=W*DPR;fgC.height=H*DPR;
    const f=fgC.getContext('2d');f.setTransform(DPR,0,0,DPR,0,0);
    f.fillStyle='#060C1E';f.beginPath();f.moveTo(0,H);
    for(let x=0;x<=W*.45;x+=6)f.lineTo(x,H*.93+Math.sin(x/W*9)*H*.012+Math.pow(x/(W*.45),2)*H*.07);
    f.lineTo(W*.45,H);f.closePath();f.fill();
    const fr=rnd(77);
    for(let i=0;i<14;i++){const x=fr()*W*.36,s=H*(.012+fr()*.016);pine(f,x,H*.95+Math.sin(x/W*9)*H*.012,s,'#050A1A')}
    const vg=f.createRadialGradient(W*.4,H*.5,H*.3,W*.4,H*.5,W*.8);vg.addColorStop(0,'rgba(5,9,22,0)');vg.addColorStop(1,'rgba(5,9,22,.3)');
    f.fillStyle=vg;f.fillRect(0,0,W,H);
  }
  function render(dt){
    if(!bgC)buildBg();
    cx.setTransform(1,0,0,1,0,0);cx.drawImage(bgC,0,0);
    cx.setTransform(DPR,0,0,DPR,0,0);
    // drifting mist
    for(let i=0;i<3;i++){const y=H*(.58+i*.08),x=((G.time*(8+i*5)+i*W*.4)%(W*1.6))-W*.5;
      const m=cx.createRadialGradient(x,y,0,x,y,W*.3);m.addColorStop(0,'rgba(240,215,210,.10)');m.addColorStop(1,'rgba(240,215,210,0)');
      cx.fillStyle=m;cx.beginPath();cx.ellipse(x,y,W*.3,H*.05,0,0,7);cx.fill()}
    // track: glowing crest
    cx.lineJoin='round';cx.lineCap='round';
    cx.save();cx.shadowColor='rgba(255,214,170,.7)';cx.shadowBlur=10;
    cx.strokeStyle='rgba(255,226,196,.9)';cx.lineWidth=Math.max(1.6,H*.0026);cx.beginPath();
    for(let u=-.04;u<=1.04;u+=.003)cx.lineTo(gx(u),gy(u));cx.stroke();cx.restore();
    // progress lit segment for leader
    const lead=T.reduce((m,t)=>Math.max(m,frac(t)),0);
    if(lead>0){cx.strokeStyle='rgba(242,196,109,.9)';cx.lineWidth=Math.max(2.4,H*.004);cx.beginPath();for(let u=0;u<=lead;u+=.003)cx.lineTo(gx(u),gy(u));cx.stroke()}
    // checkpoints
    let acc=0;
    cfg.rounds.forEach((r,i)=>{acc+=+r.pts||0;const u=acc/G.trackLen;if(u<.96)post(gx(u),gy(u),'Pos '+(i+1),H*.045,'#F2C46D',u<=lead)});
    post(gx(0),gy(0),'Start',H*.045,'#F3F5F9',true);
    summit(gx(1.0),gy(1.0));
    // dust
    G.parts=G.parts.filter(p=>(p.l-=dt)>0);
    G.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy-=8*dt;cx.fillStyle=`rgba(232,200,170,${p.l*.35})`;cx.beginPath();cx.arc(p.x,p.y,p.s*(1.8-p.l),0,7);cx.fill()});
    // bikes
    const sc=H/640*clamp(1.2-T.length*.03,.88,1.15);
    const act=T.filter(t=>G.phase==='lobby'||members(t.i).length).slice().sort((a,b)=>a.p-b.p);
    const placed=[];
    act.forEach(t=>{
      const u=frac(t),x=gx(u),y=gy(u),a=Math.atan2(gy(u+.008)-gy(u-.008),gx(u+.008)-gx(u-.008));
      const bob=Math.sin(G.time*20+t.i)*t.int*1.2;
      if((t.spd>.3||t.int>.15)&&Math.random()<.6)G.parts.push({x:x-34*sc*Math.cos(a),y:y-3,vx:-30-Math.random()*40,vy:-6-Math.random()*20,l:1,s:2.5*sc+Math.random()*2.5});
      cx.save();cx.translate(x,y+bob);cx.rotate(a);cx.scale(sc,sc);bike(t);cx.restore();
      // tag
      let ly=y-104*sc;
      for(const q of placed)if(Math.abs(q.x-x)<120*sc&&Math.abs(q.y-ly)<H*.032)ly=q.y-H*.034;
      placed.push({x,y:ly});
      const fs=Math.max(11,H*.018);cx.font=`600 ${fs}px "Saira Condensed","Arial Narrow",sans-serif`;
      const label=t.name,tw=cx.measureText(label).width,rw=fs*1.3,pad=fs*.5,w=tw+rw+pad*2,h=fs*1.7;
      cx.strokeStyle='rgba(243,245,249,.35)';cx.lineWidth=1;cx.beginPath();cx.moveTo(x,ly+h/2);cx.lineTo(x,y-84*sc);cx.stroke();
      cx.fillStyle='rgba(10,17,33,.82)';rr(x-w/2,ly-h/2,w,h,h*.22);cx.fill();
      cx.fillStyle=t.color;rr(x-w/2,ly-h/2,rw,h,h*.22);cx.fill();
      cx.textBaseline='middle';cx.textAlign='center';
      cx.fillStyle=lum(t.color)>.62?'#0C1426':'#fff';cx.fillText(t.rank,x-w/2+rw/2,ly+1);
      cx.fillStyle='#F3F5F9';cx.textAlign='left';cx.fillText(label,x-w/2+rw+pad,ly+1);
    });
    cx.setTransform(1,0,0,1,0,0);cx.drawImage(fgC,0,0);
  }
  function lum(h){const n=parseInt(h.slice(1),16);return(.299*(n>>16&255)+.587*(n>>8&255)+.114*(n&255))/255}
  function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}
  function post(x,y,txt,h,col,lit){
    cx.strokeStyle='rgba(243,245,249,.7)';cx.lineWidth=1.5;cx.beginPath();cx.moveTo(x,y);cx.lineTo(x,y-h);cx.stroke();
    cx.fillStyle=lit?col:'rgba(243,245,249,.35)';cx.fillRect(x,y-h,h*.42,h*.26);
    const fs=Math.max(11,H*.017);cx.font=`600 ${fs}px "Saira Condensed","Arial Narrow",sans-serif`;
    cx.textAlign='center';cx.textBaseline='top';cx.fillStyle='rgba(243,245,249,.82)';cx.fillText(txt,x,y+H*.016);
  }
  function summit(x,y){
    const h=H*.11,wv=Math.sin(G.time*3)*h*.04;
    cx.strokeStyle='#F3F5F9';cx.lineWidth=2;cx.beginPath();cx.moveTo(x,y);cx.lineTo(x,y-h);cx.stroke();
    cx.fillStyle='#F2C46D';cx.beginPath();cx.moveTo(x,y-h);
    cx.quadraticCurveTo(x+h*.3,y-h-h*.04+wv,x+h*.6,y-h+h*.02);cx.lineTo(x+h*.6,y-h+h*.3);cx.quadraticCurveTo(x+h*.3,y-h+h*.26-wv,x,y-h+h*.3);cx.fill();
    const fs=Math.max(12,H*.022);cx.font=`700 ${fs}px "Saira Condensed","Arial Narrow",sans-serif`;
    cx.textAlign='right';cx.textBaseline='middle';cx.fillStyle='#F3F5F9';cx.shadowColor='rgba(8,14,30,.6)';cx.shadowBlur=8;cx.fillText('Puncak',x-H*.012,y-h+h*.15);cx.shadowBlur=0;
  }
  function tire(x,y,r,a){
    cx.strokeStyle='#070B16';cx.lineWidth=6.5;cx.beginPath();cx.arc(x,y,r,0,7);cx.stroke();
    cx.strokeStyle='#121A2C';cx.lineWidth=2.6;cx.setLineDash([3,3]);cx.lineDashOffset=-a*r;cx.beginPath();cx.arc(x,y,r+2.6,0,7);cx.stroke();cx.setLineDash([]);
    cx.strokeStyle='rgba(200,210,230,.55)';cx.lineWidth=1.3;cx.beginPath();cx.arc(x,y,r-4.5,0,7);cx.stroke();
    cx.strokeStyle='rgba(200,210,230,.22)';cx.lineWidth=.8;cx.beginPath();
    for(let i=0;i<8;i++){const b=a+i*.785;cx.moveTo(x,y);cx.lineTo(x+Math.cos(b)*(r-5),y+Math.sin(b)*(r-5))}cx.stroke();
    cx.fillStyle='#2A3550';cx.beginPath();cx.arc(x,y,3.2,0,7);cx.fill();
  }
  function shape(pts,fill){cx.fillStyle=fill;cx.beginPath();pts.forEach((p,i)=>i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]));cx.closePath();cx.fill()}
  function seg(pts,w,col){cx.strokeStyle=col;cx.lineWidth=w;cx.beginPath();pts.forEach((p,i)=>i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]));cx.stroke()}
  function bike(t){
    const c=t.color,w=t.wheel,dark='#0A1120',lean=t.int*3;
    cx.lineCap='round';cx.lineJoin='round';
    // ground shadow
    cx.fillStyle='rgba(0,0,0,.28)';cx.beginPath();cx.ellipse(0,1,44,3,0,0,7);cx.fill();
    tire(-31,-16,16,w);tire(33,-16,16,w);
    seg([[-31,-16],[-3,-27]],4.5,'#3A4560');                         // swingarm
    seg([[33,-16],[22,-52]],4.2,'#C9D1E2');                          // fork lower
    seg([[25,-42],[22,-52]],5,'#1D2740');                             // fork upper
    seg([[-8,-34],[-30,-44],[-38,-46]],4,'#4A556E');                  // exhaust
    shape([[-12,-36],[10,-38],[12,-22],[-4,-19],[-12,-26]],'#141C2E');// engine
    seg([[-4,-25],[6,-46],[22,-50]],3,dark);                          // frame
    shape([[-6,-46],[19,-52],[22,-44],[16,-37],[0,-35]],c);           // shroud
    shape([[-6,-46],[19,-52],[19,-49.5],[-4,-44]],'rgba(255,255,255,.35)'); // highlight
    seg([[-31,-46],[-4,-47.5]],5.5,'#0E1526');                       // seat
    shape([[-30,-47],[-48,-55],[-44,-50],[-28,-43]],c);              // rear fender
    shape([[-26,-44],[-10,-45],[-12,-35],[-24,-37]],'#E9EDF5');      // side plate
    shape([[17,-42],[44,-37],[42,-34],[18,-38]],c);                  // front fender
    seg([[22,-52],[17,-59]],3,dark);                                  // bars
    shape([[21,-60],[29,-57],[27,-47],[21,-48]],'#E9EDF5');           // number plate
    // headlight glow
    const hg=cx.createRadialGradient(29,-52,0,29,-52,18);hg.addColorStop(0,'rgba(255,236,200,.55)');hg.addColorStop(1,'rgba(255,236,200,0)');
    cx.fillStyle=hg;cx.beginPath();cx.arc(29,-52,18,0,7);cx.fill();
    // rider
    cx.save();cx.translate(-6,-52);cx.rotate(lean*.04);cx.translate(6,52);
    seg([[-10,-54],[5,-42],[0,-25]],7,'#1A2236');                    // leg
    seg([[0,-25],[7,-24]],5.5,'#070B16');                             // boot
    seg([[-10,-54],[4,-74]],10,'#1E2840');                           // torso
    seg([[-8,-57],[3,-72]],4,c);                                      // jersey panel
    seg([[4,-72],[12,-62],[18,-59]],5,'#1E2840');                    // arm
    seg([[12,-62],[18,-59]],5,c);                                     // glove/sleeve
    cx.fillStyle=c;cx.beginPath();cx.arc(9,-82,8.5,0,7);cx.fill();   // helmet
    shape([[1,-88],[10,-91],[18,-88],[10,-86]],'rgba(255,255,255,.6)'); // stripe
    shape([[11,-85],[18,-82],[16,-77],[11,-78]],'#0A1120');           // goggles
    seg([[13,-75],[20,-73]],3.5,c);                                   // chin
    seg([[15,-91],[23,-88]],2.4,c);                                   // peak
    cx.restore();
  }
  return{init,reloadCfg};
})();

      </div><div style="margin-top:14px">${f('Instruksi untuk pemain',`rounds.${i}.desc`,'text')}</div></div>`).join('')+
      `<button class="ghost" onclick="Admin.addR()">Tambah ronde</button></div></div>`;
    h+=`<div class="sec"><div><h2>Soal kuis</h2><p>Dipakai berurutan oleh ronde kuis. Pilih bulatan di kiri untuk menandai jawaban benar.</p></div><div>`+c.quiz.map((q,i)=>`<div class="it"><div class="hd"><b>Soal ${i+1}</b><button class="mini ghost danger" onclick="Admin.del('quiz',${i})">Hapus</button></div>
      <input data-k="quiz.${i}.q" value="${esc(q.q)}">`+q.opts.map((o,j)=>`<div class="opr"><input type="radio" name="qa${i}" ${q.a===j?'checked':''} onchange="Admin.setA(${i},${j})" aria-label="Jawaban benar"><input data-k="quiz.${i}.opts.${j}" value="${esc(o)}"></div>`).join('')+`</div>`).join('')+
      `<button class="ghost" onclick="Admin.addQ()">Tambah soal</button></div></div></main>`;
    A.innerHTML=h;
    A.querySelectorAll('[data-k]').forEach(el=>el.addEventListener('change',()=>{
      let v=el.value;if(el.type==='number')v=+v;if(el.dataset.b)v=v==='1';
      set(el.dataset.k,v);
      if(el.dataset.k==='teamCount'||el.dataset.re){c=normCfg(c);render()}
    }));
  }
  function f(label,k,type,extra=''){return`<div><label>${label}</label><input type="${type}" data-k="${k}" value="${esc(get(k))}" ${extra}></div>`}
  function get(k){return k.split('.').reduce((o,p)=>o?.[p],c)}
  function set(k,v){const ps=k.split('.'),l=ps.pop();ps.reduce((o,p)=>o[p],c)[l]=v}
  function note(t){const s=$('saved');if(s){s.textContent=t;setTimeout(()=>{if($('saved'))$('saved').textContent=''},2500)}}
  return{render,
    save(){c=normCfg(c);saveCfg(c);note('Tersimpan')},
    reset(){c=normCfg({});render();note('Default dimuat, klik Simpan')},
    mv(i,d){const j=i+d;if(j<0||j>=c.rounds.length)return;[c.rounds[i],c.rounds[j]]=[c.rounds[j],c.rounds[i]];render()},
    del(k,i){c[k].splice(i,1);if(k==='rounds'&&!c.rounds.length)c=normCfg(c);render()},
    addR(){c.rounds.push({type:'tap',title:'Ronde baru',desc:'Tap tombol gas secepat mungkin.',dur:20,pts:20,qCount:3,qTime:15});render()},
    addQ(){c.quiz.push({q:'Pertanyaan baru?',opts:['Jawaban A','Jawaban B','Jawaban C','Jawaban D'],a:0});render()},
    setA(i,j){c.quiz[i].a=j},
    exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(c,null,2)],{type:'application/json'}));a.download='trail-summit-config.json';a.click()},
    imp(inp){const fl=inp.files[0];if(!fl)return;fl.text().then(t=>{try{c=normCfg(JSON.parse(t));render();note('Diimpor, klik Simpan')}catch(e){note('File tidak bisa dibaca')}})}
  };
})();

/* ===================== PHONE ===================== */
const Phone=(()=>{
  let net,room,pid,name='',me=null,S=null,connected=false,endAt=0,inited=false;
  let micOK=false,motionOK=false,sensorsAsked=false,an=null,buf=null,micV=0,shakeV=0,taps=[],v=0,myAns=null,ansQ=-1,lastKey='';
  const RING=2*Math.PI*46;
  function init(r){
    if(inited)return;inited=true;room=r;
    try{pid=localStorage.getItem('trail_pid');name=localStorage.getItem('trail_name')||''}catch(e){}
    if(!pid){pid='p'+Math.random().toString(36).slice(2,10);try{localStorage.setItem('trail_pid',pid)}catch(e){}}
    if(QS.get('pid'))pid=QS.get('pid');
    net=PhoneNet(room,pid,onMsg,(ok,err)=>{connected=ok;stat(ok,ok?'Terhubung ke room '+room:(err==='peer-unavailable'?'Layar host belum terbuka. Mencoba lagi…':'Menghubungkan…'));if(ok&&me)net.send({t:'join',name})});
    draw();
    setInterval(tick,250);
    (function raf(){meter();requestAnimationFrame(raf)})();
  }
  function stat(ok,t){$('pstat').classList.toggle('on',!!ok);$('pstt').textContent=t}
  function onMsg(m){
    if(m.t==='me'){me=m;stat(true,'Terhubung ke room '+room);draw()}
    else if(m.t==='s'){S=m;endAt=performance.now()+m.left;if(m.phase==='q'&&m.q&&m.q.i!==ansQ){myAns=null;ansQ=m.q.i}if(m.phase==='intro'||m.phase==='lobby'){ansQ=-1;myAns=null}draw()}
    else if(m.t==='st'&&S){m.teams.forEach((t,i)=>{if(S.teams[i]){S.teams[i].f=t.f;S.teams[i].r=t.r}});head()}
    else if(m.t==='who'){if(name)net.send({t:'join',name})}
    else if(m.t==='full'){$('pbody').innerHTML='<h2>Room penuh</h2><p>Room ini sudah berisi 50 pemain, batas maksimal.</p>'}
  }
  function mode(){
    if(!S||S.phase!=='play'||!S.round)return null;
    const t=S.round.type;
    if(t==='shout'&&!micOK)return'tap';
    if(t==='shake'&&!motionOK)return'tap';
    return t;
  }
  function tick(){
    const md=mode();
    if(md){
      const now=performance.now();
      if(md==='tap'){taps=taps.filter(x=>now-x<1000);v=clamp(taps.length/(S.sens.tap||8))}
      else if(md==='shout')v=micV;
      else if(md==='shake')v=shakeV;
      net.send({t:'v',v:+v.toFixed(2)});
    }else v=0;
    const pt=$('ptimer');if(pt)pt.textContent=Math.max(0,Math.ceil((endAt-performance.now())/1000));
  }
  function meter(){
    if(an){an.getFloatTimeDomainData(buf);let s=0;for(let i=0;i<buf.length;i++)s+=buf[i]*buf[i];
      const db=20*Math.log10(Math.sqrt(s/buf.length)+1e-7);
      const t=clamp((db+42)/34*((S&&S.sens.mic)||1));micV+=(t-micV)*(t>micV?.5:.12)}
    shakeV*=.94;
    const md=mode(),ring=$('ring');
    if(ring){const now=performance.now();const live=md==='tap'?clamp(taps.filter(x=>now-x<1000).length/((S&&S.sens.tap)||8)):md==='shout'?micV:shakeV;ring.style.strokeDashoffset=RING*(1-live)}
  }
  async function sensors(){
    sensorsAsked=true;
    try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}
    try{
      if(typeof DeviceMotionEvent!=='undefined'){
        if(typeof DeviceMotionEvent.requestPermission==='function'){const r=await DeviceMotionEvent.requestPermission();if(r!=='granted')throw 0}
        addEventListener('devicemotion',e=>{
          let a=e.acceleration;let m=0;
          if(a&&a.x!=null)m=Math.hypot(a.x,a.y,a.z);
          else{a=e.accelerationIncludingGravity;if(!a||a.x==null)return;m=Math.abs(Math.hypot(a.x,a.y,a.z)-9.81)}
          if(!motionOK){motionOK=true;lastKey='';draw()}
          const t=clamp(m/(22/((S&&S.sens.shake)||1)));if(t>shakeV)shakeV+=(t-shakeV)*.5;
        });
      }
    }catch(e){}
    try{
      const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      const ac=new(window.AudioContext||window.webkitAudioContext)();await ac.resume();
      const src=ac.createMediaStreamSource(st);an=ac.createAnalyser();an.fftSize=1024;buf=new Float32Array(an.fftSize);src.connect(an);micOK=true;
    }catch(e){micOK=false}
    lastKey='';draw();
  }
  function head(){
    const t=me&&S&&S.teams[me.team];
    $('pname').textContent=name||'Trail Summit';
    if(t){
      $('phone').style.setProperty('--c',t.color);
      $('pteam').textContent=t.name;
      $('pst').innerHTML=S.phase!=='lobby'?`<b>P${t.r}</b><span>${Math.round(t.f*100)}% ke puncak</span>`:'';
    }
  }
  function draw(){
    head();
    const B=$('pbody');
    if(!me){
      if(lastKey==='join')return;lastKey='join';
      B.innerHTML=`<div class="k">Room ${esc(room)}</div><h2>Trail Summit Challenge</h2><p>Isi nama yang akan tampil di layar utama.</p><input id="nm" maxlength="16" placeholder="Nama kamu" value="${esc(name)}" autocomplete="nickname"><button class="cta" id="jb">Gabung</button>`;
      $('jb').onclick=()=>{name=$('nm').value.trim()||'Pemain';try{localStorage.setItem('trail_name',name)}catch(e){}net.send({t:'join',name});stat(connected,connected?'Bergabung…':'Menunggu layar host…')};
      return;
    }
    if(!S)return;
    const t=S.teams[me.team]||S.teams[0],ph=S.phase,md=mode();
    const key=[ph,S.ri,S.q&&S.q.i,md,me.team,myAns,sensorsAsked,micOK,motionOK,ph==='lobby'?S.teams.map(x=>x.name+x.color).join():''].join('|');
    if(key===lastKey)return;lastKey=key;
    let h='';
    const sensRows=`<div class="sens"><div>Mikrofon<em class="${micOK?'on':''}">${micOK?'Aktif':sensorsAsked?'Tidak tersedia, pakai tap':'Belum aktif'}</em></div><div>Sensor gerak<em class="${motionOK?'on':''}">${motionOK?'Aktif':sensorsAsked?'Goyangkan HP untuk tes':'Belum aktif'}</em></div></div>`;
    if(ph==='lobby'){
      h=`<div><div class="k">Kamu bergabung di</div><h2>${esc(t.name)}</h2></div>${sensRows}`;
      if(!sensorsAsked)h+=`<button class="cta" id="sb">Aktifkan mic dan sensor</button>`;
      if(S.pick&&S.teams.length>1)h+=`<p>Mau pindah tim?</p><div class="tp">`+S.teams.map((x,i)=>`<button data-t="${i}" class="${i===me.team?'sel':''}" style="--tc:${x.color}"><i></i><span>${esc(x.name)}</span>${i===me.team?'✓':''}</button>`).join('')+`</div>`;
      h+=`<div class="wait"><i></i>Menunggu host memulai game</div>`;
    }else if(ph==='intro'){
      h=`<div><div class="k">Ronde ${S.ri+1} dari ${S.n}</div><h2>${esc(S.round.title)}</h2></div><p>${esc(S.round.desc)}</p><div class="big" id="ptimer"></div>`;
      if(!sensorsAsked&&(S.round.type==='shout'||S.round.type==='shake'))h+=`<button class="cta" id="sb">Aktifkan mic dan sensor</button>`;
    }else if(ph==='play'){
      const lab=md==='tap'?['Gas','Tap secepat mungkin']:md==='shout'?['Teriak','Makin keras, makin kencang']:['Goyang','Goyangkan sekuat tenaga'];
      const fb=md==='tap'&&S.round.type!=='tap'?'<p style="text-align:center;font-size:13px">Sensor belum aktif, jadi kamu pakai tap.</p>':'';
      h=`<div class="ptm"><b id="ptimer"></b><span>detik</span></div>
        <div id="padw"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="3"/><circle id="ring" cx="50" cy="50" r="46" fill="none" stroke="var(--c)" stroke-width="3" stroke-linecap="round" stroke-dasharray="${RING}" stroke-dashoffset="${RING}"/></svg>
        <div id="pad"><b>${lab[0]}</b><small>${lab[1]}</small></div></div>${fb}`;
    }else if(ph==='q'||ph==='reveal'){
      h=`<div class="k">Soal ${S.q.i+1} dari ${S.q.n}</div><div class="pq">${esc(S.q.text)}</div><div class="po">`+
        S.q.opts.map((o,i)=>{let c='';if(ph==='reveal'){c=i===S.ans?'ok':(i===myAns?'no':'')}else if(i===myAns)c='sel';
          return`<button data-a="${i}" class="${c}" ${myAns!=null||ph==='reveal'?'disabled':''}><i>${'ABCD'[i]}</i>${esc(o)}</button>`}).join('')+`</div>`+
        (ph==='reveal'?`<div class="verdict ${myAns===S.ans?'ok':'no'}">${myAns===S.ans?'Benar':myAns==null?'Waktu habis':'Belum tepat'}</div>`:myAns!=null?'<div class="wait"><i></i>Jawaban terkunci, tunggu hasilnya</div>':'<div class="ptm"><b id="ptimer"></b><span>detik</span></div>');
    }else if(ph==='result'){
      h=`<div><div class="k">Ronde ${S.ri+1} selesai</div><h2>${esc(t.name)}</h2></div><div class="big">P${t.r}</div><div class="prog"><i style="width:${Math.round(t.f*100)}%"></i></div><p>${Math.round(t.f*100)}% perjalanan ke puncak. Lihat layar utama untuk ronde berikutnya.</p>`;
    }else if(ph==='end'){
      h=`<div><div class="k">Game selesai</div><h2>${t.r===1?'Tim kamu juara':esc(t.name)}</h2></div><div class="big">P${t.r}</div><p>Terima kasih sudah bermain.</p>`;
    }
    B.innerHTML=h;
    const sb=$('sb');if(sb)sb.onclick=sensors;
    B.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>net.send({t:'team',team:+b.dataset.t}));
    B.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(myAns!=null||S.phase!=='q')return;myAns=+b.dataset.a;net.send({t:'ans',q:S.q.i,a:myAns});draw()});
    const pad=$('padw');
    if(pad)pad.addEventListener('pointerdown',e=>{e.preventDefault();taps.push(performance.now());const p=$('pad');p.classList.add('hit');setTimeout(()=>p.classList.remove('hit'),60)});
    tick();
  }
  return{init};
})();

route();
</script>
